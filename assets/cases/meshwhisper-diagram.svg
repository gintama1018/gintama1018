<svg width="760" height="260" viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MeshWhisper BLE mesh diagram: device A encrypts a packet, relays through intermediate nodes, device B decrypts it" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="260" fill="#0d0d0d"/>
  <text x="20" y="26" font-family="JetBrains Mono, monospace" font-size="12" fill="#8b8b8b" letter-spacing="1.5">FILE 01-B — MESH TOPOLOGY (TTL FLOOD ROUTING)</text>

  <!-- devices -->
  <g font-family="JetBrains Mono, monospace" font-size="12" fill="#C0C0C0">
    <circle cx="70" cy="150" r="26" fill="none" stroke="#C0C0C0" stroke-width="2"/>
    <text x="70" y="155" text-anchor="middle">A</text>
    <text x="70" y="200" text-anchor="middle" fill="#8b8b8b">sender</text>

    <circle cx="330" cy="80" r="20" fill="none" stroke="#5f5f5f" stroke-width="2"/>
    <text x="330" y="85" text-anchor="middle" fill="#8b8b8b">R1</text>

    <circle cx="330" cy="220" r="20" fill="none" stroke="#5f5f5f" stroke-width="2"/>
    <text x="330" y="225" text-anchor="middle" fill="#8b8b8b">R2</text>

    <circle cx="690" cy="150" r="26" fill="none" stroke="#C0C0C0" stroke-width="2"/>
    <text x="690" y="155" text-anchor="middle">B</text>
    <text x="690" y="200" text-anchor="middle" fill="#8b8b8b">receiver</text>
  </g>

  <!-- static relay lines -->
  <g stroke="#2b2b2b" stroke-width="1.5" fill="none">
    <line x1="94" y1="140" x2="312" y2="90"/>
    <line x1="94" y1="160" x2="312" y2="210"/>
    <line x1="348" y1="85" x2="666" y2="145"/>
    <line x1="348" y1="215" x2="666" y2="155"/>
  </g>

  <!-- encrypted packet pulses travelling A -> R1 -> B, looping -->
  <circle r="6" fill="#C0C0C0">
    <animateMotion dur="3.2s" repeatCount="indefinite"
      path="M94,140 L312,90 L348,85 L666,145" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- second pulse, slightly offset, via R2 -->
  <circle r="5" fill="#7a7a7a">
    <animateMotion dur="3.2s" begin="1.1s" repeatCount="indefinite"
      path="M94,160 L312,210 L348,215 L666,155" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
  </circle>

  <text x="380" y="252" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#5f5f5f">X25519 key agreement · AES-256-GCM payload · Ed25519 signature · relays never see plaintext</text>
</svg>
