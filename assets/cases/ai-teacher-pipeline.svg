<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f1624"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Glowing Line Gradients -->
    <linearGradient id="flowGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#39d353"/>
    </linearGradient>

    <linearGradient id="flowGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39d353"/>
      <stop offset="100%" stop-color="#e3b341"/>
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#061a12"/>
      <stop offset="100%" stop-color="#020805"/>
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.5" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Frame Background -->
  <rect x="0" y="0" width="820" height="220" rx="10" fill="url(#pipeBg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Top Terminal Header -->
  <g transform="translate(16, 14)">
    <circle cx="6" cy="6" r="4" fill="#ff5f56"/>
    <circle cx="20" cy="6" r="4" fill="#ffbd2e"/>
    <circle cx="34" cy="6" r="4" fill="#27c93f"/>
    <text x="50" y="10" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#8b949e">
      PIPELINE ARCHITECTURE // END-TO-END 720p LECTURE SYNTHESIS
    </text>
    <rect x="670" y="-1" width="120" height="16" rx="3" fill="#161f2e" stroke="#39d353" stroke-width="0.8"/>
    <text x="730" y="10" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" fill="#39d353" text-anchor="middle">
      STATUS: LIVE ENGINE
    </text>
    <line x1="0" y1="18" x2="788" y2="18" stroke="#21262d" stroke-width="1"/>
  </g>

  <!-- ==================== STAGE 1: INGESTION ==================== -->
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="130" height="140" rx="8" fill="#0d1117" stroke="#388bfd" stroke-width="1.2"/>
    <rect x="0" y="0" width="130" height="24" rx="8" fill="#162235"/>
    <text x="65" y="16" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#58a6ff" text-anchor="middle">
      01. USER QUERY
    </text>

    <!-- Terminal Prompt Mockup -->
    <rect x="8" y="32" width="114" height="60" rx="4" fill="#05080e" stroke="#1f293d" stroke-width="1"/>
    <text x="14" y="46" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#79c0ff">&gt; topic: "Black</text>
    <text x="14" y="58" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#79c0ff">  Holes &amp; GR"</text>
    <text x="14" y="72" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#8b949e">&gt; level: college</text>
    <rect x="94" y="65" width="4" height="8" fill="#58a6ff">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>

    <!-- Status pill -->
    <text x="65" y="112" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8b949e" text-anchor="middle">
      Natural Language
    </text>
    <text x="65" y="125" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="bold" fill="#39d353" text-anchor="middle">
      PARSED IN 12ms
    </text>
  </g>

  <!-- Flow Connector 1 -> 2 with moving packet -->
  <g transform="translate(150, 115)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#388bfd" stroke-width="2" stroke-dasharray="4 2"/>
    <circle cx="0" cy="0" r="3.5" fill="#58a6ff">
      <animate attributeName="cx" values="0;35" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ==================== STAGE 2: CHROMADB RAG ==================== -->
  <g transform="translate(185, 50)">
    <rect x="0" y="0" width="130" height="140" rx="8" fill="#0d1117" stroke="#8957e5" stroke-width="1.2"/>
    <rect x="0" y="0" width="130" height="24" rx="8" fill="#271a40"/>
    <text x="65" y="16" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#d2a8ff" text-anchor="middle">
      02. CHROMADB RAG
    </text>

    <!-- Vector Node Constellation -->
    <g transform="translate(20, 32)">
      <rect x="0" y="0" width="90" height="60" rx="4" fill="#0c0714" stroke="#38225e" stroke-width="1"/>
      <!-- Glowing Vector Nodes -->
      <circle cx="20" cy="20" r="4" fill="#d2a8ff"/>
      <circle cx="70" cy="18" r="4" fill="#bc8cff"/>
      <circle cx="45" cy="42" r="5" fill="#39d353">
        <animate attributeName="r" values="4;6;4" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <line x1="20" y1="20" x2="45" y2="42" stroke="#8957e5" stroke-width="1" stroke-dasharray="2 2"/>
      <line x1="70" y1="18" x2="45" y2="42" stroke="#8957e5" stroke-width="1" stroke-dasharray="2 2"/>
    </g>

    <text x="65" y="112" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8b949e" text-anchor="middle">
      Vector Cosine Match
    </text>
    <text x="65" y="125" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="bold" fill="#d2a8ff" text-anchor="middle">
      TOP-5 RELEVANCE
    </text>
  </g>

  <!-- Flow Connector 2 -> 3 with moving packet -->
  <g transform="translate(315, 115)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#8957e5" stroke-width="2" stroke-dasharray="4 2"/>
    <circle cx="0" cy="0" r="3.5" fill="#d2a8ff">
      <animate attributeName="cx" values="0;35" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ==================== STAGE 3: DUAL-LLM ROUTER ==================== -->
  <g transform="translate(350, 50)">
    <rect x="0" y="0" width="140" height="140" rx="8" fill="#0d1117" stroke="#e3b341" stroke-width="1.2"/>
    <rect x="0" y="0" width="140" height="24" rx="8" fill="#302409"/>
    <text x="70" y="16" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#FFE066" text-anchor="middle">
      03. DUAL-LLM ENGINE
    </text>

    <!-- Dual Brain Containers -->
    <g transform="translate(10, 32)">
      <!-- Claude Card -->
      <rect x="0" y="0" width="120" height="28" rx="3" fill="#1b1509" stroke="#d29922" stroke-width="0.8"/>
      <circle cx="12" cy="14" r="3" fill="#f0883e">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.1s" repeatCount="indefinite"/>
      </circle>
      <text x="22" y="12" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="bold" fill="#FFE066">Claude 3.5 Sonnet</text>
      <text x="22" y="22" font-family="'JetBrains Mono', monospace" font-size="6.5" fill="#8b949e">Lecture Script &amp; Math Logic</text>

      <!-- Gemini Card -->
      <rect x="0" y="34" width="120" height="28" rx="3" fill="#08182b" stroke="#388bfd" stroke-width="0.8"/>
      <circle cx="12" cy="48" r="3" fill="#58a6ff">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.1s" repeatCount="indefinite"/>
      </circle>
      <text x="22" y="46" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="bold" fill="#79c0ff">Gemini 1.5 Pro</text>
      <text x="22" y="56" font-family="'JetBrains Mono', monospace" font-size="6.5" fill="#8b949e">Pedagogy &amp; Visual Prompt</text>
    </g>

    <text x="70" y="112" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8b949e" text-anchor="middle">
      Context: 128k Tokens
    </text>
    <text x="70" y="125" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="bold" fill="#39d353" text-anchor="middle">
      SYNTHESIS COMPLETE
    </text>
  </g>

  <!-- Flow Connector 3 -> 4 with moving packet -->
  <g transform="translate(490, 115)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#e3b341" stroke-width="2" stroke-dasharray="4 2"/>
    <circle cx="0" cy="0" r="3.5" fill="#FFE066">
      <animate attributeName="cx" values="0;35" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ==================== STAGE 4: AVATAR & AUDIO ==================== -->
  <g transform="translate(525, 50)">
    <rect x="0" y="0" width="130" height="140" rx="8" fill="#0d1117" stroke="#39d353" stroke-width="1.2"/>
    <rect x="0" y="0" width="130" height="24" rx="8" fill="#0d2818"/>
    <text x="65" y="16" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#39d353" text-anchor="middle">
      04. AVATAR &amp; TTS
    </text>

    <!-- Animated Face Avatar -->
    <g transform="translate(16, 32)">
      <rect x="0" y="0" width="98" height="60" rx="4" fill="#05140b" stroke="#1b472c" stroke-width="1"/>
      <!-- Avatar Head -->
      <circle cx="30" cy="30" r="14" fill="#1b472c" stroke="#39d353" stroke-width="1.5"/>
      <circle cx="26" cy="28" r="1.8" fill="#ffffff"/>
      <circle cx="34" cy="28" r="1.8" fill="#ffffff"/>
      <!-- Lip-Sync Mouth Animation -->
      <line x1="27" y1="35" x2="33" y2="35" stroke="#39d353" stroke-width="2" stroke-linecap="round">
        <animate attributeName="y1" values="35;37;35" dur="0.4s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="35;37;35" dur="0.4s" repeatCount="indefinite"/>
      </line>

      <!-- Dynamic Audio Waveform -->
      <g transform="translate(52, 16)">
        <rect x="0" y="14" width="3" height="12" fill="#39d353" rx="1">
          <animate attributeName="height" values="8;24;8" dur="0.6s" repeatCount="indefinite"/>
          <animate attributeName="y" values="16;8;16" dur="0.6s" repeatCount="indefinite"/>
        </rect>
        <rect x="6" y="10" width="3" height="18" fill="#39d353" rx="1">
          <animate attributeName="height" values="18;8;26;18" dur="0.5s" repeatCount="indefinite"/>
          <animate attributeName="y" values="10;16;6;10" dur="0.5s" repeatCount="indefinite"/>
        </rect>
        <rect x="12" y="6" width="3" height="24" fill="#39d353" rx="1">
          <animate attributeName="height" values="24;14;28;24" dur="0.7s" repeatCount="indefinite"/>
          <animate attributeName="y" values="6;12;4;6" dur="0.7s" repeatCount="indefinite"/>
        </rect>
        <rect x="18" y="12" width="3" height="16" fill="#39d353" rx="1">
          <animate attributeName="height" values="14;22;8;14" dur="0.55s" repeatCount="indefinite"/>
          <animate attributeName="y" values="12;6;16;12" dur="0.55s" repeatCount="indefinite"/>
        </rect>
        <rect x="24" y="16" width="3" height="8" fill="#39d353" rx="1">
          <animate attributeName="height" values="8;18;8" dur="0.65s" repeatCount="indefinite"/>
          <animate attributeName="y" values="16;10;16" dur="0.65s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <text x="65" y="112" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8b949e" text-anchor="middle">
      Phoneme Viseme Sync
    </text>
    <text x="65" y="125" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="bold" fill="#39d353" text-anchor="middle">
      ZERO AUDIO LAG
    </text>
  </g>

  <!-- Flow Connector 4 -> 5 with moving packet -->
  <g transform="translate(655, 115)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#39d353" stroke-width="2" stroke-dasharray="4 2"/>
    <circle cx="0" cy="0" r="3.5" fill="#39d353">
      <animate attributeName="cx" values="0;30" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ==================== STAGE 5: 720P VIDEO RENDER ==================== -->
  <g transform="translate(685, 50)">
    <rect x="0" y="0" width="115" height="140" rx="8" fill="#0d1117" stroke="#f0883e" stroke-width="1.2"/>
    <rect x="0" y="0" width="115" height="24" rx="8" fill="#2b1706"/>
    <text x="57" y="16" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#ff9b5e" text-anchor="middle">
      05. 720p VIDEO
    </text>

    <!-- Mini Video Monitor -->
    <g transform="translate(10, 32)">
      <rect x="0" y="0" width="95" height="60" rx="4" fill="url(#screenGrad)" stroke="#bd5b00" stroke-width="1"/>
      <rect x="0" y="0" width="95" height="60" rx="4" fill="url(#scanlines)"/>
      
      <!-- Video Resolution Tag -->
      <rect x="4" y="4" width="38" height="10" rx="2" fill="#bd5b00"/>
      <text x="23" y="12" font-family="'JetBrains Mono', monospace" font-size="6.5" font-weight="bold" fill="#FFF" text-anchor="middle">720p HD</text>

      <!-- Draw Math / Physics Sine Curve inside monitor -->
      <path d="M 6 35 Q 24 10 45 35 T 88 35" fill="none" stroke="#39d353" stroke-width="1.5" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" values="100;0;100" dur="3s" repeatCount="indefinite"/>
      </path>

      <!-- Play triangle -->
      <polygon points="44,48 52,53 44,58" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- Progress Render Bar -->
    <g transform="translate(10, 102)">
      <rect x="0" y="0" width="95" height="8" rx="2" fill="#21262d"/>
      <rect x="0" y="0" width="95" height="8" rx="2" fill="#39d353">
        <animate attributeName="width" values="10;95;95;10" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="57" y="125" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="bold" fill="#39d353" text-anchor="middle">
      READY TO DOWNLOAD
    </text>
  </g>
</svg>
