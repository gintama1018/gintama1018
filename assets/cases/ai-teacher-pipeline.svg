<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="100%" height="100%">
  <defs>
    <!-- Dark Smoked Gradient -->
    <linearGradient id="pipeDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#121215"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>

    <!-- Silk Sheen Line -->
    <linearGradient id="silverPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="50%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect x="0" y="0" width="820" height="220" rx="10" fill="url(#pipeDarkBg)" stroke="#27272a" stroke-width="1"/>

  <!-- Top Terminal Header -->
  <g transform="translate(16, 14)">
    <circle cx="6" cy="6" r="3.5" fill="#3f3f46"/>
    <circle cx="18" cy="6" r="3.5" fill="#52525b"/>
    <circle cx="30" cy="6" r="3.5" fill="#71717a"/>
    <text x="45" y="9.5" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#a1a1aa" letter-spacing="1.5">
      PIPELINE ARCHITECTURE // AUTONOMOUS 720p LECTURE SYNTHESIS
    </text>
    <rect x="675" y="-2" width="115" height="18" rx="3" fill="#18181b" stroke="#3f3f46" stroke-width="0.8"/>
    <text x="732" y="10" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" fill="#f4f4f5" text-anchor="middle">
      ENGINE ONLINE
    </text>
    <line x1="0" y1="18" x2="788" y2="18" stroke="#27272a" stroke-width="0.8"/>
  </g>

  <!-- ==================== STAGE 1: INGESTION ==================== -->
  <g transform="translate(20, 48)">
    <rect x="0" y="0" width="130" height="142" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <rect x="0" y="0" width="130" height="24" rx="6" fill="#18181b"/>
    <text x="65" y="16" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" fill="#f4f4f5" text-anchor="middle">
      01. USER QUERY
    </text>

    <!-- Query Input Terminal Box -->
    <rect x="8" y="32" width="114" height="64" rx="4" fill="#09090b" stroke="#27272a" stroke-width="0.8"/>
    <text x="14" y="48" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#e4e4e7">&gt; topic: "General</text>
    <text x="14" y="60" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#e4e4e7">  Relativity"</text>
    <text x="14" y="74" font-family="'JetBrains Mono', monospace" font-size="7" fill="#71717a">&gt; level: college</text>
    <rect x="92" y="67" width="4" height="8" fill="#a1a1aa">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <text x="65" y="112" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#71717a" text-anchor="middle">
      Intent Extraction
    </text>
    <text x="65" y="126" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" fill="#d4d4d8" text-anchor="middle">
      PARSED IN 12ms
    </text>
  </g>

  <!-- Flow Connector 1 -> 2 with moving white pulse -->
  <g transform="translate(150, 118)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff">
      <animate attributeName="cx" values="0;35" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ==================== STAGE 2: CHROMADB RAG ==================== -->
  <g transform="translate(185, 48)">
    <rect x="0" y="0" width="130" height="142" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <rect x="0" y="0" width="130" height="24" rx="6" fill="#18181b"/>
    <text x="65" y="16" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" fill="#f4f4f5" text-anchor="middle">
      02. CHROMADB RAG
    </text>

    <!-- Vector Node Box -->
    <g transform="translate(20, 32)">
      <rect x="0" y="0" width="90" height="64" rx="4" fill="#09090b" stroke="#27272a" stroke-width="0.8"/>
      <circle cx="22" cy="22" r="3.5" fill="#71717a"/>
      <circle cx="68" cy="20" r="3.5" fill="#71717a"/>
      <circle cx="45" cy="44" r="4.5" fill="#d4d4d8">
        <animate attributeName="r" values="3.5;5;3.5" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <line x1="22" y1="22" x2="45" y2="44" stroke="#3f3f46" stroke-width="0.8" stroke-dasharray="2 2"/>
      <line x1="68" y1="20" x2="45" y2="44" stroke="#3f3f46" stroke-width="0.8" stroke-dasharray="2 2"/>
    </g>

    <text x="65" y="112" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#71717a" text-anchor="middle">
      Vector Cosine Match
    </text>
    <text x="65" y="126" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" fill="#d4d4d8" text-anchor="middle">
      TOP-5 RETRIEVED
    </text>
  </g>

  <!-- Flow Connector 2 -> 3 -->
  <g transform="translate(315, 118)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff">
      <animate attributeName="cx" values="0;35" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ==================== STAGE 3: DUAL-LLM ROUTER ==================== -->
  <g transform="translate(350, 48)">
    <rect x="0" y="0" width="140" height="142" rx="6" fill="#121215" stroke="#3f3f46" stroke-width="1"/>
    <rect x="0" y="0" width="140" height="24" rx="6" fill="#18181b"/>
    <text x="70" y="16" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" fill="#f4f4f5" text-anchor="middle">
      03. DUAL-LLM ENGINE
    </text>

    <!-- Dual Brain Containers -->
    <g transform="translate(10, 32)">
      <!-- Claude Card -->
      <rect x="0" y="0" width="120" height="30" rx="3" fill="#18181b" stroke="#27272a" stroke-width="0.8"/>
      <circle cx="12" cy="15" r="3" fill="#c5a059"/>
      <text x="22" y="14" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" fill="#f4f4f5">Claude 3.5 Sonnet</text>
      <text x="22" y="24" font-family="'JetBrains Mono', monospace" font-size="6.5" fill="#a1a1aa">Script &amp; Math Logic</text>

      <!-- Gemini Card -->
      <rect x="0" y="34" width="120" height="30" rx="3" fill="#18181b" stroke="#27272a" stroke-width="0.8"/>
      <circle cx="12" cy="49" r="3" fill="#d4d4d8"/>
      <text x="22" y="48" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" fill="#f4f4f5">Gemini 1.5 Pro</text>
      <text x="22" y="58" font-family="'JetBrains Mono', monospace" font-size="6.5" fill="#a1a1aa">Pedagogy &amp; Visuals</text>
    </g>

    <text x="70" y="112" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#71717a" text-anchor="middle">
      128k Token Context
    </text>
    <text x="70" y="126" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" fill="#c5a059" text-anchor="middle">
      SYNTHESIS COMPLETE
    </text>
  </g>

  <!-- Flow Connector 3 -> 4 -->
  <g transform="translate(490, 118)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff">
      <animate attributeName="cx" values="0;35" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ==================== STAGE 4: AVATAR & AUDIO ==================== -->
  <g transform="translate(525, 48)">
    <rect x="0" y="0" width="130" height="142" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <rect x="0" y="0" width="130" height="24" rx="6" fill="#18181b"/>
    <text x="65" y="16" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" fill="#f4f4f5" text-anchor="middle">
      04. AVATAR &amp; TTS
    </text>

    <!-- Minimalist Avatar Portrait & Waveform -->
    <g transform="translate(16, 32)">
      <rect x="0" y="0" width="98" height="64" rx="4" fill="#09090b" stroke="#27272a" stroke-width="0.8"/>
      <circle cx="28" cy="32" r="14" fill="#18181b" stroke="#52525b" stroke-width="1"/>
      <circle cx="24" cy="30" r="1.5" fill="#f4f4f5"/>
      <circle cx="32" cy="30" r="1.5" fill="#f4f4f5"/>
      <line x1="25" y1="37" x2="31" y2="37" stroke="#d4d4d8" stroke-width="1.5" stroke-linecap="round">
        <animate attributeName="y1" values="37;39;37" dur="0.45s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="37;39;37" dur="0.45s" repeatCount="indefinite"/>
      </line>

      <!-- Soft White Audio Waveform -->
      <g transform="translate(52, 18)">
        <rect x="0" y="14" width="2.5" height="12" fill="#d4d4d8" rx="1">
          <animate attributeName="height" values="8;24;8" dur="0.6s" repeatCount="indefinite"/>
          <animate attributeName="y" values="16;8;16" dur="0.6s" repeatCount="indefinite"/>
        </rect>
        <rect x="6" y="10" width="2.5" height="18" fill="#d4d4d8" rx="1">
          <animate attributeName="height" values="18;8;26;18" dur="0.5s" repeatCount="indefinite"/>
          <animate attributeName="y" values="10;16;6;10" dur="0.5s" repeatCount="indefinite"/>
        </rect>
        <rect x="12" y="6" width="2.5" height="24" fill="#ffffff" rx="1">
          <animate attributeName="height" values="24;14;28;24" dur="0.7s" repeatCount="indefinite"/>
          <animate attributeName="y" values="6;12;4;6" dur="0.7s" repeatCount="indefinite"/>
        </rect>
        <rect x="18" y="12" width="2.5" height="16" fill="#d4d4d8" rx="1">
          <animate attributeName="height" values="14;22;8;14" dur="0.55s" repeatCount="indefinite"/>
          <animate attributeName="y" values="12;6;16;12" dur="0.55s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <text x="65" y="112" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#71717a" text-anchor="middle">
      Viseme Lip-Sync
    </text>
    <text x="65" y="126" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" fill="#d4d4d8" text-anchor="middle">
      ZERO AUDIO LAG
    </text>
  </g>

  <!-- Flow Connector 4 -> 5 -->
  <g transform="translate(655, 118)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff">
      <animate attributeName="cx" values="0;30" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ==================== STAGE 5: 720p VIDEO ==================== -->
  <g transform="translate(685, 48)">
    <rect x="0" y="0" width="115" height="142" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <rect x="0" y="0" width="115" height="24" rx="6" fill="#18181b"/>
    <text x="57" y="16" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" fill="#f4f4f5" text-anchor="middle">
      05. 720p VIDEO
    </text>

    <!-- Sleek Monitor Display -->
    <g transform="translate(10, 32)">
      <rect x="0" y="0" width="95" height="64" rx="4" fill="#09090b" stroke="#27272a" stroke-width="0.8"/>
      
      <!-- Video Resolution Tag -->
      <rect x="4" y="4" width="36" height="10" rx="2" fill="#27272a"/>
      <text x="22" y="11.5" font-family="'JetBrains Mono', monospace" font-size="6.5" font-weight="bold" fill="#a1a1aa" text-anchor="middle">720p HD</text>

      <!-- Draw Math / Physics Curve -->
      <path d="M 6 38 Q 24 12 45 38 T 88 38" fill="none" stroke="#f4f4f5" stroke-width="1.2" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" values="100;0;100" dur="3s" repeatCount="indefinite"/>
      </path>

      <!-- Minimal Play Triangle -->
      <polygon points="44,50 52,55 44,60" fill="#71717a"/>
    </g>

    <!-- Progress Render Bar in soft silver -->
    <g transform="translate(10, 104)">
      <rect x="0" y="0" width="95" height="6" rx="2" fill="#18181b"/>
      <rect x="0" y="0" width="95" height="6" rx="2" fill="#d4d4d8">
        <animate attributeName="width" values="10;95;95;10" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="57" y="126" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="bold" fill="#f4f4f5" text-anchor="middle">
      READY TO STREAM
    </text>
  </g>
</svg>
