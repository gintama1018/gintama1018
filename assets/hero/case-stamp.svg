<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Case file opened, stamped, Silver Soul Studios" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="paper-lines" width="900" height="26" patternUnits="userSpaceOnUse">
      <line x1="0" y1="25" x2="900" y2="25" stroke="#232323" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="260" fill="#0d0d0d"/>
  <rect width="900" height="260" fill="url(#paper-lines)"/>

  <!-- redacted bars, fade in first -->
  <g fill="#1c1c1c" opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.1s" dur="0.4s" fill="freeze"/>
    <rect x="60" y="46" width="260" height="16"/>
    <rect x="60" y="78" width="380" height="16"/>
    <rect x="60" y="110" width="200" height="16"/>
    <rect x="60" y="142" width="320" height="16"/>
    <rect x="60" y="174" width="150" height="16"/>
  </g>

  <text x="60" y="30" font-family="JetBrains Mono, monospace" font-size="13" fill="#8b8b8b" letter-spacing="2">SILVER SOUL STUDIOS — SUBJECT FILE 01018</text>

  <!-- the stamp: starts big + rotated + transparent, slams to final position -->
  <g transform="translate(660,150)" opacity="0">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.55;0.6" dur="2.4s" begin="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="rotate"
      values="-18 660 150; -18 660 150; -10 660 150; -12 660 150"
      keyTimes="0;0.55;0.75;1" dur="2.4s" begin="0.6s" fill="freeze" additive="sum"/>
    <animateTransform attributeName="transform" type="scale"
      values="2.4;2.4;0.95;1" keyTimes="0;0.55;0.72;1" dur="2.4s" begin="0.6s" fill="freeze" additive="sum"/>
    <g transform="rotate(-12)">
      <rect x="-190" y="-58" width="380" height="116" fill="none" stroke="#C0C0C0" stroke-width="6"/>
      <rect x="-178" y="-46" width="356" height="92" fill="none" stroke="#C0C0C0" stroke-width="2"/>
      <text x="0" y="-8" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="34" font-weight="700" fill="#C0C0C0" letter-spacing="4">CASE FILE</text>
      <text x="0" y="30" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="26" font-weight="700" fill="#C0C0C0" letter-spacing="6">OPENED</text>
    </g>
  </g>

  <text x="60" y="230" font-family="JetBrains Mono, monospace" font-size="13" fill="#5f5f5f">STATUS: under active investigation — see FILE 01 below</text>
</svg>
