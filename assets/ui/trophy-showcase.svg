<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 270" width="100%" height="100%">
  <defs>
    <!-- Smoked Obsidian Background -->
    <linearGradient id="galleryBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#121215"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>

    <!-- Brushed Champagne Gold -->
    <linearGradient id="champagneGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Polished Platinum Silver -->
    <linearGradient id="platinumSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d4d4d8"/>
      <stop offset="100%" stop-color="#71717a"/>
    </linearGradient>

    <!-- Antique Titanium Bronze -->
    <linearGradient id="warmBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e7e5e4"/>
      <stop offset="50%" stop-color="#a8a29e"/>
      <stop offset="100%" stop-color="#57534e"/>
    </linearGradient>

    <!-- Silk Sheen Light Sweep -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        from="-1.5 0" to="1.5 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="pedestalBeam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect x="0" y="0" width="850" height="270" rx="10" fill="url(#galleryBg)" stroke="#27272a" stroke-width="1"/>

  <!-- Perspective Subtle Floor Lines -->
  <g opacity="0.25">
    <line x1="0" y1="200" x2="850" y2="200" stroke="#71717a" stroke-width="0.8"/>
    <line x1="0" y1="225" x2="850" y2="225" stroke="#71717a" stroke-width="0.8"/>
    <line x1="0" y1="250" x2="850" y2="250" stroke="#71717a" stroke-width="1"/>
    <line x1="425" y1="170" x2="50" y2="270" stroke="#71717a" stroke-width="0.8"/>
    <line x1="425" y1="170" x2="230" y2="270" stroke="#71717a" stroke-width="0.8"/>
    <line x1="425" y1="170" x2="620" y2="270" stroke="#71717a" stroke-width="0.8"/>
    <line x1="425" y1="170" x2="800" y2="270" stroke="#71717a" stroke-width="0.8"/>
  </g>

  <!-- Top Minimalist Banner -->
  <g transform="translate(20, 16)">
    <circle cx="6" cy="7" r="3" fill="#c5a059">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="18" y="10.5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#d4d4d8" letter-spacing="2">
      FORENSIC COMMENDATIONS // VERIFIED MERIT ARCHIVE
    </text>
    <text x="730" y="10.5" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#71717a">
      [5 HONORS]
    </text>
    <line x1="0" y1="18" x2="810" y2="18" stroke="#27272a" stroke-width="0.8"/>
  </g>

  <!-- ==================== PODIUM 1: ICAHTE (BEST PAPER) ==================== -->
  <g transform="translate(20, 46)">
    <!-- Base Pedestal -->
    <polygon points="25,155 135,155 145,170 15,170" fill="#18181b" stroke="#3f3f46" stroke-width="0.8"/>
    <polygon points="35,155 125,155 115,85 45,85" fill="url(#pedestalBeam)"/>

    <!-- Floating Trophy (Hover Animation) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="3.4s" repeatCount="indefinite"/>
      <circle cx="80" cy="50" r="24" fill="#18181b" stroke="url(#champagneGold)" stroke-width="1.8"/>
      <circle cx="80" cy="50" r="19" fill="none" stroke="#71717a" stroke-dasharray="3 3"/>
      
      <!-- Trophy Icon Symbol -->
      <path d="M 73 40 L 87 40 L 87 50 A 7 7 0 0 1 73 50 Z M 71 43 L 68 43 A 4 4 0 0 0 72 49 L 73 49 M 89 43 L 92 43 A 4 4 0 0 1 88 49 L 87 49 M 80 50 L 80 57 M 75 57 L 85 57"
            fill="none" stroke="#fef08a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      
      <circle cx="80" cy="50" r="24" fill="url(#goldSheen)"/>
    </g>

    <!-- Information Card -->
    <rect x="15" y="174" width="130" height="40" rx="4" fill="#121215" stroke="#27272a" stroke-width="0.8"/>
    <text x="80" y="188" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#f4f4f5" text-anchor="middle">
      BEST PAPER AWARD
    </text>
    <text x="80" y="200" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#a1a1aa" text-anchor="middle">
      ICAHTE-2026 Conf
    </text>
    <text x="80" y="209" font-family="'JetBrains Mono', monospace" font-size="7" fill="#c5a059" text-anchor="middle">
      AHTE_26_R_101
    </text>
  </g>

  <!-- ==================== PODIUM 2: HACKUEM (1ST PLACE) ==================== -->
  <g transform="translate(185, 46)">
    <!-- Base Pedestal -->
    <polygon points="25,155 135,155 145,170 15,170" fill="#18181b" stroke="#3f3f46" stroke-width="0.8"/>
    <polygon points="35,155 125,155 115,85 45,85" fill="url(#pedestalBeam)"/>

    <!-- Floating Trophy -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,-4; 0,2; 0,-4" dur="3s" repeatCount="indefinite"/>
      <circle cx="80" cy="50" r="24" fill="#18181b" stroke="url(#platinumSilver)" stroke-width="1.8"/>
      <circle cx="80" cy="50" r="19" fill="none" stroke="#71717a" stroke-dasharray="3 3"/>

      <!-- 1st Cup Icon -->
      <path d="M 70 38 L 90 38 L 90 51 C 90 57 80 59 80 59 C 80 59 70 57 70 51 Z M 70 41 L 65 41 C 63 46 67 51 70 51 M 90 41 L 95 41 C 97 46 93 51 90 51 M 80 59 L 80 63 M 74 63 L 86 63"
            fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      <text x="80" y="49" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" fill="#f4f4f5" text-anchor="middle">1st</text>

      <circle cx="80" cy="50" r="24" fill="url(#goldSheen)"/>
    </g>

    <!-- Information Card -->
    <rect x="15" y="174" width="130" height="40" rx="4" fill="#121215" stroke="#27272a" stroke-width="0.8"/>
    <text x="80" y="188" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#f4f4f5" text-anchor="middle">
      1ST PLACE WINNER
    </text>
    <text x="80" y="200" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#a1a1aa" text-anchor="middle">
      HackUEM Hackathon
    </text>
    <text x="80" y="209" font-family="'JetBrains Mono', monospace" font-size="7" fill="#d4d4d8" text-anchor="middle">
      BharatKart Voice Engine
    </text>
  </g>

  <!-- ==================== PODIUM 3: PROMPTWARS (AIR 15) ==================== -->
  <g transform="translate(350, 46)">
    <!-- Base Pedestal -->
    <polygon points="25,155 135,155 145,170 15,170" fill="#18181b" stroke="#3f3f46" stroke-width="0.8"/>
    <polygon points="35,155 125,155 115,85 45,85" fill="url(#pedestalBeam)"/>

    <!-- Floating Medal -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,1; 0,-5; 0,1" dur="3.6s" repeatCount="indefinite"/>
      <polygon points="80,26 104,50 80,74 56,50" fill="#18181b" stroke="url(#champagneGold)" stroke-width="1.8"/>
      <polygon points="80,32 98,50 80,68 62,50" fill="none" stroke="#71717a" stroke-dasharray="2 2"/>

      <text x="80" y="47" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" fill="#a1a1aa" text-anchor="middle">AIR</text>
      <text x="80" y="60" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#fef08a" text-anchor="middle">15</text>

      <polygon points="80,26 104,50 80,74 56,50" fill="url(#goldSheen)"/>
    </g>

    <!-- Information Card -->
    <rect x="15" y="174" width="130" height="40" rx="4" fill="#121215" stroke="#27272a" stroke-width="0.8"/>
    <text x="80" y="188" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#f4f4f5" text-anchor="middle">
      AIR 15 / ~30,000
    </text>
    <text x="80" y="200" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#a1a1aa" text-anchor="middle">
      Google PromptWars 2
    </text>
    <text x="80" y="209" font-family="'JetBrains Mono', monospace" font-size="7" fill="#c5a059" text-anchor="middle">
      CarbonPulse Telemetry
    </text>
  </g>

  <!-- ==================== PODIUM 4: THUNDERCIPHER (3RD PLACE) ==================== -->
  <g transform="translate(515, 46)">
    <!-- Base Pedestal -->
    <polygon points="25,155 135,155 145,170 15,170" fill="#18181b" stroke="#3f3f46" stroke-width="0.8"/>
    <polygon points="35,155 125,155 115,85 45,85" fill="url(#pedestalBeam)"/>

    <!-- Floating Shield -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,-2; 0,4; 0,-2" dur="3.2s" repeatCount="indefinite"/>
      <path d="M 80 26 L 102 36 L 102 56 C 102 68 80 77 80 77 C 80 77 58 68 58 56 L 58 36 Z"
            fill="#18181b" stroke="url(#warmBronze)" stroke-width="1.8"/>
      
      <circle cx="80" cy="48" r="4" fill="#d4d4d8"/>
      <polygon points="78,50 82,50 83,59 77,59" fill="#d4d4d8"/>

      <path d="M 80 26 L 102 36 L 102 56 C 102 68 80 77 80 77 C 80 77 58 68 58 56 L 58 36 Z" fill="url(#goldSheen)"/>
    </g>

    <!-- Information Card -->
    <rect x="15" y="174" width="130" height="40" rx="4" fill="#121215" stroke="#27272a" stroke-width="0.8"/>
    <text x="80" y="188" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#f4f4f5" text-anchor="middle">
      3RD PLACE PODIUM
    </text>
    <text x="80" y="200" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#a1a1aa" text-anchor="middle">
      ThunderCipher CTF
    </text>
    <text x="80" y="209" font-family="'JetBrains Mono', monospace" font-size="7" fill="#a8a29e" text-anchor="middle">
      ROCA Cryptanalysis
    </text>
  </g>

  <!-- ==================== PODIUM 5: AI INNOVATION ==================== -->
  <g transform="translate(680, 46)">
    <!-- Base Pedestal -->
    <polygon points="25,155 135,155 145,170 15,170" fill="#18181b" stroke="#3f3f46" stroke-width="0.8"/>
    <polygon points="35,155 125,155 115,85 45,85" fill="url(#pedestalBeam)"/>

    <!-- Floating Star -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,3; 0,-3; 0,3" dur="3.5s" repeatCount="indefinite"/>
      <polygon points="80,26 104,39 104,65 80,78 56,65 56,39" fill="#18181b" stroke="url(#platinumSilver)" stroke-width="1.8"/>
      
      <circle cx="80" cy="52" r="5" fill="#e4e4e7">
        <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <line x1="80" y1="52" x2="69" y2="44" stroke="#71717a" stroke-width="1"/>
      <line x1="80" y1="52" x2="91" y2="44" stroke="#71717a" stroke-width="1"/>
      <line x1="80" y1="52" x2="80" y2="64" stroke="#71717a" stroke-width="1"/>

      <polygon points="80,26 104,39 104,65 80,78 56,65 56,39" fill="url(#goldSheen)"/>
    </g>

    <!-- Information Card -->
    <rect x="15" y="174" width="130" height="40" rx="4" fill="#121215" stroke="#27272a" stroke-width="0.8"/>
    <text x="80" y="188" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#f4f4f5" text-anchor="middle">
      ROUND 2 FINALIST
    </text>
    <text x="80" y="200" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#a1a1aa" text-anchor="middle">
      AI Innovation Hackathon
    </text>
    <text x="80" y="209" font-family="'JetBrains Mono', monospace" font-size="7" fill="#d4d4d8" text-anchor="middle">
      AI Teacher 720p Pipeline
    </text>
  </g>
</svg>
