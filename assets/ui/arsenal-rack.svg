<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="rackDarkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>

    <!-- Silver & Champagne Meter Gradients -->
    <linearGradient id="silverMeter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#52525b"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>

    <linearGradient id="champagneMeter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#785c28"/>
      <stop offset="100%" stop-color="#c5a059"/>
    </linearGradient>

    <linearGradient id="titaniumMeter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect x="0" y="0" width="850" height="250" rx="10" fill="url(#rackDarkBg)" stroke="#27272a" stroke-width="1"/>

  <!-- Top Header Bar -->
  <g transform="translate(20, 16)">
    <text x="0" y="10" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#f4f4f5" letter-spacing="2">
      ISSUED FIELD ARSENAL // TOOLING &amp; SYSTEM SPECIFICATION
    </text>
    <rect x="690" y="-3" width="120" height="18" rx="3" fill="#18181b" stroke="#3f3f46" stroke-width="0.8"/>
    <text x="750" y="9.5" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" fill="#a1a1aa" text-anchor="middle">
      ACTIVE LOADOUT
    </text>
    <line x1="0" y1="18" x2="810" y2="18" stroke="#27272a" stroke-width="0.8"/>
  </g>

  <!-- ==================== COLUMN 1: SYSTEMS & CRYPTO ==================== -->
  <g transform="translate(20, 44)">
    <rect x="0" y="0" width="195" height="190" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
    
    <!-- Title Strip -->
    <rect x="0" y="0" width="195" height="24" rx="6" fill="#18181b"/>
    <text x="10" y="16" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" fill="#f4f4f5">
      SYSTEMS &amp; CRYPTO
    </text>

    <!-- Meter -->
    <g transform="translate(10, 32)">
      <rect x="0" y="0" width="175" height="4" rx="2" fill="#27272a"/>
      <rect x="0" y="0" width="168" height="4" rx="2" fill="url(#silverMeter)">
        <animate attributeName="width" values="100;168;150;168" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Items -->
    <g transform="translate(10, 48)">
      <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e4e4e7">▸ Curve25519 / X25519</text>
      <text x="0" y="26" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e4e4e7">▸ AES-256-GCM / Wire</text>
      <text x="0" y="40" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e4e4e7">▸ Ghidra Decompiler</text>
      <text x="0" y="54" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e4e4e7">▸ Wireshark PCAP Audit</text>
      <text x="0" y="68" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e4e4e7">▸ SQLCipher AES-CBC</text>
      <text x="0" y="82" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e4e4e7">▸ Android Native / Rust</text>
      <text x="0" y="96" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e4e4e7">▸ GDB &amp; Memory Reversing</text>
    </g>

    <!-- Status Strip -->
    <rect x="8" y="166" width="179" height="16" rx="3" fill="#18181b"/>
    <text x="97" y="177.5" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" fill="#a1a1aa" text-anchor="middle">
      READINESS: 98% (HARDENED)
    </text>
  </g>

  <!-- ==================== COLUMN 2: NEURAL & AI ==================== -->
  <g transform="translate(225, 44)">
    <rect x="0" y="0" width="195" height="190" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>

    <!-- Title Strip -->
    <rect x="0" y="0" width="195" height="24" rx="6" fill="#18181b"/>
    <text x="10" y="16" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" fill="#f4f4f5">
      NEURAL &amp; APPLIED AI
    </text>

    <!-- Meter -->
    <g transform="translate(10, 32)">
      <rect x="0" y="0" width="175" height="4" rx="2" fill="#27272a"/>
      <rect x="0" y="0" width="162" height="4" rx="2" fill="url(#champagneMeter)">
        <animate attributeName="width" values="120;162;140;162" dur="3.6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Items -->
    <g transform="translate(10, 48)">
      <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e4e4e7">▸ Gemini 1.5 Pro API</text>
      <text x="0" y="26" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e4e4e7">▸ Claude 3.5 Sonnet</text>
      <text x="0" y="40" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e4e4e7">▸ Pathway Streaming Engine</text>
      <text x="0" y="54" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e4e4e7">▸ ChromaDB Vector Store</text>
      <text x="0" y="68" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e4e4e7">▸ MediaPipe Vision Core</text>
      <text x="0" y="82" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e4e4e7">▸ ElevenLabs Neural TTS</text>
      <text x="0" y="96" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e4e4e7">▸ Sentinel NDVI Processing</text>
    </g>

    <!-- Status Strip -->
    <rect x="8" y="166" width="179" height="16" rx="3" fill="#18181b"/>
    <text x="97" y="177.5" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" fill="#c5a059" text-anchor="middle">
      READINESS: 95% (COGNITIVE)
    </text>
  </g>

  <!-- ==================== COLUMN 3: WEB & ARCHITECTURE ==================== -->
  <g transform="translate(430, 44)">
    <rect x="0" y="0" width="195" height="190" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>

    <!-- Title Strip -->
    <rect x="0" y="0" width="195" height="24" rx="6" fill="#18181b"/>
    <text x="10" y="16" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" fill="#f4f4f5">
      WEB &amp; ARCHITECTURE
    </text>

    <!-- Meter -->
    <g transform="translate(10, 32)">
      <rect x="0" y="0" width="175" height="4" rx="2" fill="#27272a"/>
      <rect x="0" y="0" width="158" height="4" rx="2" fill="url(#titaniumMeter)">
        <animate attributeName="width" values="110;158;135;158" dur="4.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Items -->
    <g transform="translate(10, 48)">
      <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e4e4e7">▸ Next.js 15 App Router</text>
      <text x="0" y="26" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e4e4e7">▸ TypeScript &amp; React 19</text>
      <text x="0" y="40" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e4e4e7">▸ FastAPI &amp; Async Python</text>
      <text x="0" y="54" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e4e4e7">▸ PostgreSQL &amp; SQLite</text>
      <text x="0" y="68" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e4e4e7">▸ SQLAlchemy &amp; Alembic</text>
      <text x="0" y="82" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e4e4e7">▸ Tailwind CSS &amp; SMIL</text>
      <text x="0" y="96" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e4e4e7">▸ WebSockets &amp; Real-time</text>
    </g>

    <!-- Status Strip -->
    <rect x="8" y="166" width="179" height="16" rx="3" fill="#18181b"/>
    <text x="97" y="177.5" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" fill="#a1a1aa" text-anchor="middle">
      READINESS: 92% (FULL-STACK)
    </text>
  </g>

  <!-- ==================== COLUMN 4: AUTOMATION & HARDWARE ==================== -->
  <g transform="translate(635, 44)">
    <rect x="0" y="0" width="195" height="190" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>

    <!-- Title Strip -->
    <rect x="0" y="0" width="195" height="24" rx="6" fill="#18181b"/>
    <text x="10" y="16" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" fill="#f4f4f5">
      AUTOMATION &amp; HARDWARE
    </text>

    <!-- Meter -->
    <g transform="translate(10, 32)">
      <rect x="0" y="0" width="175" height="4" rx="2" fill="#27272a"/>
      <rect x="0" y="0" width="150" height="4" rx="2" fill="url(#silverMeter)">
        <animate attributeName="width" values="90;150;130;150" dur="3.8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Items -->
    <g transform="translate(10, 48)">
      <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e4e4e7">▸ n8n Workflow Pipelines</text>
      <text x="0" y="26" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e4e4e7">▸ GitHub Actions CI/CD</text>
      <text x="0" y="40" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e4e4e7">▸ Bare-Metal AVR / Arduino</text>
      <text x="0" y="54" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e4e4e7">▸ MAX7219 LED Matrix</text>
      <text x="0" y="68" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e4e4e7">▸ OSRM Routing Engine</text>
      <text x="0" y="82" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e4e4e7">▸ Pygame 2D Engines</text>
      <text x="0" y="96" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e4e4e7">▸ Linux Bash &amp; Powershell</text>
    </g>

    <!-- Status Strip -->
    <rect x="8" y="166" width="179" height="16" rx="3" fill="#18181b"/>
    <text x="97" y="177.5" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" fill="#a1a1aa" text-anchor="middle">
      READINESS: 90% (TACTICAL)
    </text>
  </g>
</svg>
