      <text x="0" y="28" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#e6edf3">▸ Claude 3.5 Sonnet</text>
      <text x="0" y="44" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#e6edf3">▸ Pathway In-Memory AI</text>
      <text x="0" y="60" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#e6edf3">▸ ChromaDB Vector Store</text>
      <text x="0" y="76" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#e6edf3">▸ MediaPipe Vision Core</text>
      <text x="0" y="92" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#e6edf3">▸ ElevenLabs Neural TTS</text>
