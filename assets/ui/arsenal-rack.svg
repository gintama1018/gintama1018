      <text x="0" y="28" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#e6edf3">▸ GitHub Actions CI/CD</text>
      <text x="0" y="44" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#e6edf3">▸ Bare-Metal AVR / Arduino</text>
      <text x="0" y="60" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#e6edf3">▸ MAX7219 Matrix Driver</text>
      <text x="0" y="76" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#e6edf3">▸ OSRM Routing Engine</text>
