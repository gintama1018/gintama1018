<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="rackBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#06090e"/>
    </linearGradient>

    <!-- Neon Bar Gradients -->
    <linearGradient id="greenMeter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#39d353"/>
    </linearGradient>

    <linearGradient id="cyanMeter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>

    <linearGradient id="goldMeter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d29922"/>
      <stop offset="100%" stop-color="#FFE066"/>
    </linearGradient>

    <linearGradient id="purpleMeter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957e5"/>
      <stop offset="100%" stop-color="#d2a8ff"/>
    </linearGradient>

    <pattern id="gridPattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#161f2e" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Frame Background -->
  <rect x="0" y="0" width="850" height="260" rx="12" fill="url(#rackBg)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="0" y="0" width="850" height="260" rx="12" fill="url(#gridPattern)"/>

  <!-- Top HUD Header -->
  <g transform="translate(20, 16)">
    <polygon points="0,0 8,8 0,16" fill="#39d353"/>
    <text x="18" y="12" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#ffffff" letter-spacing="1.5">
      ISSUED FIELD ARSENAL // WEAPONS &amp; TOOLING LOADOUT
    </text>
    <rect x="680" y="0" width="130" height="16" rx="3" fill="#161f2e" stroke="#39d353" stroke-width="0.8"/>
    <text x="745" y="11" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" fill="#39d353" text-anchor="middle">
      ALL SYSTEMS PRIMED
    </text>
    <line x1="0" y1="22" x2="810" y2="22" stroke="#21262d" stroke-width="1"/>
  </g>

  <!-- ==================== RACK COLUMN 1: SYSTEMS & CRYPTO ==================== -->
  <g transform="translate(20, 48)">
    <rect x="0" y="0" width="195" height="195" rx="8" fill="#0d1117" stroke="#39d353" stroke-width="1.2"/>
    
    <!-- Title Strip -->
