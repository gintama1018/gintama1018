    <text x="10" y="17" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#39d353">
      🔒 SYSTEMS &amp; CRYPTO
    </text>

    <!-- Progress Meter -->
    <g transform="translate(10, 34)">
      <rect x="0" y="0" width="175" height="6" rx="2" fill="#161b22"/>
      <rect x="0" y="0" width="168" height="6" rx="2" fill="url(#greenMeter)">
        <animate attributeName="width" values="100;168;150;168" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Equipment Items -->
    <g transform="translate(10, 52)">
      <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#e6edf3">▸ Curve25519 / X25519</text>
      <text x="0" y="28" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#e6edf3">▸ AES-256-GCM / Wire</text>
      <text x="0" y="44" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#e6edf3">▸ Ghidra Decompiler</text>
      <text x="0" y="60" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#e6edf3">▸ Wireshark PCAP Audit</text>
      <text x="0" y="76" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#e6edf3">▸ SQLCipher AES-CBC</text>
