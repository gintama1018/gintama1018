<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%">
  <defs>
    <!-- Obsidian Card Background -->
    <linearGradient id="caseDarkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121215"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Silver Silk Sheen -->
    <linearGradient id="silverSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        from="-1 0" to="2 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="whiteRays" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- ==================== CARD 1: KISAN-AI ==================== -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="265" height="220" rx="8" fill="url(#caseDarkBg)" stroke="#27272a" stroke-width="1"/>
    <rect x="0" y="0" width="265" height="220" rx="8" fill="url(#silverSheen)"/>

    <!-- Header & Tag -->
    <rect x="12" y="12" width="55" height="18" rx="3" fill="#18181b" stroke="#3f3f46" stroke-width="0.8"/>
    <text x="39" y="24" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" fill="#a1a1aa" text-anchor="middle">FILE 04</text>

    <rect x="188" y="12" width="65" height="18" rx="3" fill="#18181b" stroke="#3f3f46" stroke-width="0.8"/>
    <text x="220" y="24" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="bold" fill="#f4f4f5" text-anchor="middle">LIVE PROD</text>

    <text x="12" y="48" font-family="'Segoe UI', -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#f4f4f5">
      KISAN-AI
    </text>
    <text x="12" y="62" font-family="'JetBrains Mono', monospace" font-size="8" fill="#71717a">
      Satellite Multispectral Remote Sensing
    </text>

    <!-- Satellite Orbit Animation Box -->
    <g transform="translate(12, 70)">
      <rect x="0" y="0" width="241" height="80" rx="4" fill="#09090b" stroke="#27272a" stroke-width="0.8"/>
      
      <!-- Monochromatic Crop Grid -->
      <polygon points="0,80 241,80 241,52 0,52" fill="#121215"/>
      <line x1="0" y1="66" x2="241" y2="66" stroke="#27272a" stroke-width="0.8"/>
      <line x1="60" y1="52" x2="40" y2="80" stroke="#27272a" stroke-width="0.8"/>
      <line x1="120" y1="52" x2="120" y2="80" stroke="#27272a" stroke-width="0.8"/>
      <line x1="180" y1="52" x2="200" y2="80" stroke="#27272a" stroke-width="0.8"/>

      <!-- Orbiting Satellite & Scanning Cone -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="20,0; 180,0; 20,0" dur="6.5s" repeatCount="indefinite"/>
        <polygon points="20,18 0,62 40,62" fill="url(#whiteRays)"/>

        <!-- Satellite Body -->
        <rect x="14" y="12" width="12" height="7" rx="1" fill="#e4e4e7"/>
        <rect x="5" y="14" width="8" height="3" fill="#71717a"/>
        <rect x="27" y="14" width="8" height="3" fill="#71717a"/>
        <circle cx="20" cy="15.5" r="1.2" fill="#ffffff"/>
      </g>

      <text x="8" y="15" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#f4f4f5">NDVI: 0.81 (HEALTHY)</text>
      <text x="8" y="27" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#71717a">SENTINEL-2 L2A 10m</text>
    </g>

    <!-- Metrics -->
    <text x="12" y="168" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#a1a1aa">
      • Soil nitrogen &amp; moisture mapping
    </text>
    <text x="12" y="180" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#a1a1aa">
      • Eliminates yield estimation errors
    </text>

    <!-- Buttons -->
    <g transform="translate(12, 192)">
      <rect x="0" y="0" width="115" height="18" rx="3" fill="#27272a"/>
      <text x="57" y="12" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" fill="#f4f4f5" text-anchor="middle">LIVE APP ↗</text>

      <rect x="125" y="0" width="115" height="18" rx="3" fill="#18181b" stroke="#27272a" stroke-width="0.8"/>
      <text x="182" y="12" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="500" fill="#a1a1aa" text-anchor="middle">VIEW CODE</text>
    </g>
  </g>

  <!-- ==================== CARD 2: BHARATKART ==================== -->
  <g transform="translate(290, 10)">
    <rect x="0" y="0" width="265" height="220" rx="8" fill="url(#caseDarkBg)" stroke="#3f3f46" stroke-width="1"/>
    <rect x="0" y="0" width="265" height="220" rx="8" fill="url(#silverSheen)"/>

    <!-- Header & Tag -->
    <rect x="12" y="12" width="55" height="18" rx="3" fill="#18181b" stroke="#3f3f46" stroke-width="0.8"/>
    <text x="39" y="24" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" fill="#c5a059" text-anchor="middle">FILE 05</text>

    <rect x="175" y="12" width="78" height="18" rx="3" fill="#18181b" stroke="#3f3f46" stroke-width="0.8"/>
    <text x="214" y="24" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="bold" fill="#c5a059" text-anchor="middle">🏆 1ST PLACE</text>

    <text x="12" y="48" font-family="'Segoe UI', -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#f4f4f5">
      BharatKart
    </text>
    <text x="12" y="62" font-family="'JetBrains Mono', monospace" font-size="8" fill="#71717a">
      Voice-First Dialect E-Commerce
    </text>

    <!-- Dialect Audio Box -->
    <g transform="translate(12, 70)">
      <rect x="0" y="0" width="241" height="80" rx="4" fill="#09090b" stroke="#27272a" stroke-width="0.8"/>

      <circle cx="26" cy="34" r="12" fill="#18181b" stroke="#71717a" stroke-width="1"/>
      <path d="M 23 29 L 29 29 L 29 36 A 3 3 0 0 1 23 36 Z M 21 33 A 5 5 0 0 0 31 33 M 26 38 L 26 42"
            fill="none" stroke="#d4d4d8" stroke-width="1.2"/>

      <!-- Audio Waveform -->
      <g transform="translate(48, 24)">
        <rect x="0" y="6" width="2.5" height="16" fill="#c5a059">
          <animate attributeName="height" values="8;18;8" dur="0.4s" repeatCount="indefinite"/>
        </rect>
        <rect x="5" y="2" width="2.5" height="24" fill="#d4d4d8">
          <animate attributeName="height" values="24;10;24" dur="0.5s" repeatCount="indefinite"/>
        </rect>
        <rect x="10" y="7" width="2.5" height="14" fill="#c5a059">
          <animate attributeName="height" values="14;22;14" dur="0.45s" repeatCount="indefinite"/>
        </rect>
      </g>

      <path d="M 68 34 L 80 34 M 76 30 L 81 34 L 76 38" stroke="#71717a" stroke-width="1.2"/>

      <!-- Catalog Output -->
      <g transform="translate(92, 14)">
        <rect x="0" y="0" width="138" height="52" rx="3" fill="#18181b" stroke="#27272a" stroke-width="0.8"/>
        <text x="8" y="16" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" fill="#f4f4f5">ITEM: Handcrafted Rug</text>
        <text x="8" y="28" font-family="'JetBrains Mono', monospace" font-size="7" fill="#a1a1aa">PRICE: ₹1,250 · STOCK: 14</text>
        <text x="8" y="42" font-family="'JetBrains Mono', monospace" font-size="6.5" fill="#c5a059">✓ CATALOG GENERATED</text>
      </g>

      <text x="8" y="74" font-family="'JetBrains Mono', monospace" font-size="7" fill="#71717a">
        AUDIO: "दो शॉल बनाई हैं, बारह सौ पचास..."
      </text>
    </g>

    <!-- Metrics -->
    <text x="12" y="168" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#a1a1aa">
      • Zero typing required for artisans
    </text>
    <text x="12" y="180" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#a1a1aa">
      • Awarded 1st Place at HackUEM
    </text>

    <!-- Buttons -->
    <g transform="translate(12, 192)">
      <rect x="0" y="0" width="240" height="18" rx="3" fill="#27272a"/>
      <text x="120" y="12" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" fill="#f4f4f5" text-anchor="middle">EXAMINE AWARDED CODE ↗</text>
    </g>
  </g>

  <!-- ==================== CARD 3: ROADSOS ==================== -->
  <g transform="translate(570, 10)">
    <rect x="0" y="0" width="265" height="220" rx="8" fill="url(#caseDarkBg)" stroke="#27272a" stroke-width="1"/>
    <rect x="0" y="0" width="265" height="220" rx="8" fill="url(#silverSheen)"/>

    <!-- Header & Tag -->
    <rect x="12" y="12" width="55" height="18" rx="3" fill="#18181b" stroke="#3f3f46" stroke-width="0.8"/>
    <text x="39" y="24" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" fill="#a1a1aa" text-anchor="middle">FILE 06</text>

    <rect x="178" y="12" width="75" height="18" rx="3" fill="#18181b" stroke="#3f3f46" stroke-width="0.8"/>
    <text x="215" y="24" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="500" fill="#a1a1aa" text-anchor="middle">OFFLINE GRID</text>

    <text x="12" y="48" font-family="'Segoe UI', -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#f4f4f5">
      ROADSoS
    </text>
    <text x="12" y="62" font-family="'JetBrains Mono', monospace" font-size="8" fill="#71717a">
      Zero-Coverage Emergency Platform
    </text>

    <!-- Emergency Beacon Box -->
    <g transform="translate(12, 70)">
      <rect x="0" y="0" width="241" height="80" rx="4" fill="#09090b" stroke="#27272a" stroke-width="0.8"/>

      <!-- Pulsing Beacon Waves in soft silver/white -->
      <g transform="translate(45, 40)">
        <circle cx="0" cy="0" r="8" fill="none" stroke="#71717a" stroke-width="1.2">
          <animate attributeName="r" values="5;32" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="0" cy="0" r="8" fill="none" stroke="#a1a1aa" stroke-width="0.8">
          <animate attributeName="r" values="5;32" dur="2s" begin="1s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.8;0" dur="2s" begin="1s" repeatCount="indefinite"/>
        </circle>
        <circle cx="0" cy="0" r="4" fill="#f4f4f5"/>
      </g>

      <!-- Jurisdiction List -->
      <g transform="translate(95, 14)">
        <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" fill="#d4d4d8">DISPATCH MATRIX:</text>
        <text x="0" y="25" font-family="'JetBrains Mono', monospace" font-size="7" fill="#a1a1aa">IND: 112 · USA: 911</text>
        <text x="0" y="37" font-family="'JetBrains Mono', monospace" font-size="7" fill="#a1a1aa">GBR: 999 · 12+ Nations</text>
        <text x="0" y="50" font-family="'JetBrains Mono', monospace" font-size="6.5" fill="#c5a059">LAT/LONG SMS ZERO DATA</text>
      </g>
    </g>

    <!-- Metrics -->
    <text x="12" y="168" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#a1a1aa">
      • Zero-bandwidth SMS &amp; GPS emergency
    </text>
    <text x="12" y="180" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#a1a1aa">
      • Local offline regulatory caches
    </text>

    <!-- Buttons -->
    <g transform="translate(12, 192)">
      <rect x="0" y="0" width="240" height="18" rx="3" fill="#18181b" stroke="#27272a" stroke-width="0.8"/>
      <text x="120" y="12" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="500" fill="#f4f4f5" text-anchor="middle">EXAMINE REPOSITORY ↗</text>
    </g>
  </g>
</svg>
