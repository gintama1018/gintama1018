<svg width="900" height="36" viewBox="0 0 900 36" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="evidence tape divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="stripes" width="28" height="36" patternUnits="userSpaceOnUse" patternTransform="skewX(-30)">
      <rect width="14" height="36" fill="#1c1c1c"/>
      <rect x="14" width="14" height="36" fill="#141414"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="28 0" dur="6s" repeatCount="indefinite" additive="sum"/>
    </pattern>
  </defs>
  <rect width="900" height="36" fill="url(#stripes)"/>
  <rect y="0" width="900" height="2" fill="#3a3a3a"/>
  <rect y="34" width="900" height="2" fill="#3a3a3a"/>
  <text x="450" y="23" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#8b8b8b" letter-spacing="3">DO NOT CROSS — EVIDENCE</text>
</svg>
