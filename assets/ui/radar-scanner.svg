<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="radarDarkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#121215"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>

    <!-- Titanium Scope Gradient -->
    <radialGradient id="scopeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="70%" stop-color="#0e0e11"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>

    <!-- Translucent Silver Radar Sweep -->
    <linearGradient id="silverSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#a1a1aa" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#71717a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect x="0" y="0" width="820" height="250" rx="10" fill="url(#radarDarkBg)" stroke="#27272a" stroke-width="1"/>

  <!-- Left Side: Circular Titanium Radar Scope -->
  <g transform="translate(130, 125)">
    <!-- Outer Scope Rim -->
    <circle cx="0" cy="0" r="105" fill="url(#scopeGrad)" stroke="#3f3f46" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#27272a" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="#27272a" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#27272a" stroke-width="0.8"/>

    <!-- Crosshair Axes -->
    <line x1="-105" y1="0" x2="105" y2="0" stroke="#27272a" stroke-width="0.8"/>
    <line x1="0" y1="-105" x2="0" y2="105" stroke="#27272a" stroke-width="0.8"/>
    <line x1="-75" y1="-75" x2="75" y2="75" stroke="#1f1f23" stroke-width="0.6"/>
    <line x1="-75" y1="75" x2="75" y2="-75" stroke="#1f1f23" stroke-width="0.6"/>

    <!-- 360-Degree Rotating Radar Sweep Fan -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4.5s" repeatCount="indefinite"/>
      <path d="M 0 0 L 0 -105 A 105 105 0 0 1 74 -74 Z" fill="url(#silverSweep)"/>
      <line x1="0" y1="0" x2="0" y2="-105" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
    </g>

    <!-- MCD Delhi Sanitation Node Blips (Pulsing Silver/Champagne) -->
    <!-- Center Node -->
    <circle cx="0" cy="0" r="3" fill="#f4f4f5"/>

    <!-- Node cluster 1 -->
    <circle cx="35" cy="-45" r="2.5" fill="#d4d4d8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="48" cy="-32" r="2" fill="#a1a1aa"/>
    <circle cx="20" cy="-60" r="2" fill="#c5a059">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Node cluster 2 -->
    <circle cx="-50" cy="-25" r="2.5" fill="#e4e4e7">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-38" cy="-55" r="2" fill="#a1a1aa"/>

    <!-- Node cluster 3 -->
    <circle cx="-42" cy="48" r="2.5" fill="#d4d4d8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-65" cy="28" r="2" fill="#71717a"/>
    <circle cx="-25" cy="65" r="2.5" fill="#c5a059"/>

    <!-- Node cluster 4 -->
    <circle cx="45" cy="40" r="2.5" fill="#f4f4f5">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="68" cy="22" r="2" fill="#a1a1aa"/>
    <circle cx="55" cy="58" r="2" fill="#71717a"/>

    <!-- Outer Compass Ticks -->
    <text x="0" y="-93" font-family="'JetBrains Mono', monospace" font-size="7" fill="#71717a" text-anchor="middle">N</text>
    <text x="96" y="3" font-family="'JetBrains Mono', monospace" font-size="7" fill="#71717a" text-anchor="middle">E</text>
    <text x="0" y="100" font-family="'JetBrains Mono', monospace" font-size="7" fill="#71717a" text-anchor="middle">S</text>
    <text x="-96" y="3" font-family="'JetBrains Mono', monospace" font-size="7" fill="#71717a" text-anchor="middle">W</text>
  </g>

  <!-- Right Side: Telemetry Metrics & Delhi MCD Node Status -->
  <g transform="translate(275, 24)">
    <!-- Header -->
    <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#71717a" letter-spacing="2">
      INFRAWATCH NEXUS // CIVIC RADAR TELEMETRY
    </text>
    <text x="0" y="32" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#f4f4f5">
      Municipal Sanitation Monitoring Grid
    </text>

    <!-- Geographic Target Strip -->
    <rect x="0" y="44" width="510" height="26" rx="4" fill="#121215" stroke="#27272a" stroke-width="0.8"/>
    <text x="12" y="61" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#d4d4d8">
      TARGET: <tspan fill="#f4f4f5" font-weight="bold">MUNICIPAL CORPORATION OF DELHI (MCD)</tspan> · NCR REGION
    </text>

    <!-- 3 Metrics Boxes -->
    <g transform="translate(0, 80)">
      <!-- Box 1 -->
      <rect x="0" y="0" width="162" height="60" rx="4" fill="#121215" stroke="#27272a" stroke-width="0.8"/>
      <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#71717a">DEPLOYED NODES</text>
      <text x="12" y="42" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" fill="#f4f4f5">106</text>
      <text x="56" y="40" font-family="'JetBrains Mono', monospace" font-size="8" fill="#a1a1aa">MCD Bins</text>

      <!-- Box 2 -->
      <rect x="174" y="0" width="162" height="60" rx="4" fill="#121215" stroke="#27272a" stroke-width="0.8"/>
      <text x="186" y="18" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#71717a">EVALUATION MODEL</text>
      <text x="186" y="36" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#f4f4f5">Gemini 1.5</text>
      <text x="186" y="48" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#c5a059">Multimodal Vision</text>

      <!-- Box 3 -->
      <rect x="348" y="0" width="162" height="60" rx="4" fill="#121215" stroke="#27272a" stroke-width="0.8"/>
      <text x="360" y="18" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#71717a">STREAMING ENGINE</text>
      <text x="360" y="36" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#f4f4f5">Pathway</text>
      <text x="360" y="48" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#a1a1aa">In-Memory Sync</text>
    </g>

    <!-- Bottom Status Strip -->
    <g transform="translate(0, 152)">
      <rect x="0" y="0" width="510" height="30" rx="4" fill="#121215" stroke="#3f3f46" stroke-width="0.8"/>
      <circle cx="16" cy="15" r="3.5" fill="#c5a059"/>
      <text x="28" y="19" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" fill="#f4f4f5">
        ICAHTE-2026 BEST PAPER AWARD // PAPER ID: AHTE_26_R_101
      </text>
    </g>
  </g>
</svg>
