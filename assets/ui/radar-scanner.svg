<svg width="720" height="220" viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="InfraWatch Nexus: Real-time Multi-node Radar Scanner over Delhi MCD Civic Reference Points">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .grid-ring { fill: none; stroke: #1f6feb; stroke-width: 1; opacity: 0.25; }
      .grid-cross { stroke: #1f6feb; stroke-width: 1; stroke-dasharray: 4,4; opacity: 0.3; }
      .hud-title { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #58a6ff; font-weight: bold; }
      .hud-val { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #8b949e; }
      .hud-alert { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #ff7b72; font-weight: bold; }
      .hud-green { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #39d353; font-weight: bold; }
    </style>

    <!-- Radar Sweep Gradient Cone -->
    <radialGradient id="sweep-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#1f6feb" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Panel Frame -->
  <rect width="720" height="220" rx="8" class="bg"/>
  <rect x="1" y="1" width="718" height="218" rx="7" fill="none" stroke="#2b2b2b" stroke-width="1.5"/>

  <!-- Left: Radar Screen (Center at cx=140, cy=110, radius=85) -->
  <g id="radar-scope" transform="translate(140, 110)">
    <!-- Concentric Distance Rings -->
    <circle r="85" class="grid-ring"/>
    <circle r="60" class="grid-ring"/>
    <circle r="35" class="grid-ring"/>
    <circle r="12" class="grid-ring"/>

    <!-- Crosshairs -->
    <line x1="-90" y1="0" x2="90" y2="0" class="grid-cross"/>
    <line x1="0" y1="-90" x2="0" y2="90" class="grid-cross"/>

    <!-- Rotating Radar Sweep Beam (360 deg in 4s) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      <!-- Sweep Sector -->
      <path d="M 0 0 L 85 0 A 85 85 0 0 0 60 -60 Z" fill="url(#sweep-gradient)"/>
      <line x1="0" y1="0" x2="85" y2="0" stroke="#79c0ff" stroke-width="2"/>
    </g>

    <!-- Radar Blips (Simulating MCD Sanitation Points in Delhi) -->
    <!-- Blip 1: Central Delhi Node -->
    <g transform="translate(25, -35)">
      <circle r="4" fill="#ff7b72">
        <animate attributeName="opacity" values="0;1;0.8;0.3;0" keyTimes="0;0.1;0.3;0.7;1" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle r="8" fill="none" stroke="#ff7b72" stroke-width="1">
        <animate attributeName="r" values="4;14" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Blip 2: North MCD Node -->
    <g transform="translate(-40, -45)">
      <circle r="3" fill="#39d353">
        <animate attributeName="opacity" values="0;1;0.8;0.2;0" keyTimes="0.25;0.35;0.55;0.85;1" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Blip 3: South MCD Node -->
    <g transform="translate(45, 40)">
      <circle r="3" fill="#D4AF37">
        <animate attributeName="opacity" values="0;1;0.8;0.2;0" keyTimes="0.5;0.6;0.75;0.95;1" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Blip 4: West MCD Node -->
    <g transform="translate(-50, 30)">
      <circle r="3" fill="#39d353">
        <animate attributeName="opacity" values="0;1;0.8;0.2;0" keyTimes="0.75;0.85;0.95;0.98;1" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Center Pivot Indicator -->
    <circle r="2.5" fill="#58a6ff"/>
  </g>

  <!-- Middle & Right: Live Telemetry HUD Stream -->
  <g transform="translate(260, 26)">
    <!-- Header -->
    <text x="0" y="14" class="hud-title" letter-spacing="1">INFRAWATCH NEXUS // CIVIC RADAR TELEMETRY</text>
    <line x1="0" y1="24" x2="430" y2="24" stroke="#30363d" stroke-width="1"/>

    <!-- Grid Data Columns -->
    <g transform="translate(0, 42)">
      <!-- Row 1 -->
      <text x="0" y="0" class="hud-val">SURVEILLANCE SECTOR :</text>
      <text x="170" y="0" class="hud-green">DELHI MCD (106 CIVIC NODES)</text>

      <!-- Row 2 -->
      <text x="0" y="22" class="hud-val">MULTI-MODAL SCORING :</text>
      <text x="170" y="22" class="hud-title">GEMINI 1.5 PRO VISION [ONLINE]</text>

      <!-- Row 3 -->
      <text x="0" y="44" class="hud-val">STREAMING ENGINE    :</text>
      <text x="170" y="44" class="hud-val">PATHWAY IN-MEMORY PIPELINE</text>

      <!-- Row 4 -->
      <text x="0" y="66" class="hud-val">AUDIO DISPATCH      :</text>
      <text x="170" y="66" class="hud-alert">ELEVENLABS HINDI TTS [ACTIVE]</text>

      <!-- Row 5 -->
      <text x="0" y="88" class="hud-val">GEO-ROUTING ENGINE  :</text>
      <text x="170" y="88" class="hud-val">OSRM + LEAFLET FLEET DISPATCH</text>

      <!-- Row 6 -->
      <text x="0" y="110" class="hud-val">ACADEMIC RECORD     :</text>
      <text x="170" y="110" style="font-family:'JetBrains Mono',monospace;font-size:10px;fill:#D4AF37;font-weight:bold;">BEST PAPER AWARD · ICAHTE-2026</text>
    </g>

    <!-- Live Status Pulse Indicator -->
    <g transform="translate(0, 172)">
      <rect x="0" y="-10" width="430" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="12" cy="1" r="3.5" fill="#39d353">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="4.5" class="hud-green">DISPATCH FREQUENCY: 106 NODES MONITORED IN REAL-TIME</text>
    </g>
  </g>
</svg>
