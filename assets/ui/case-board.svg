    <text x="215" y="14" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" fill="#c5a059" text-anchor="middle">🥇 1ST PLACE</text>

    <!-- Content -->
    <text x="12" y="42" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#f4f4f5">BharatKart</text>
    <text x="12" y="58" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#a1a1aa">Voice-first artisan marketplace</text>
    <text x="12" y="72" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#71717a">Speech-to-Catalog · Zero-Typing UI</text>

    <!-- Metrics -->
    <rect x="10" y="85" width="240" height="18" rx="3" fill="#18181b"/>
    <text x="16" y="97.5" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#c5a059">HACKUEM: Grand Champion Winner</text>
  </g>

  <!-- CASE 06: ROADSoS -->
  <g transform="translate(570, 172)">
    <rect x="0" y="0" width="260" height="115" rx="6" fill="url(#folderBg)" stroke="#27272a" stroke-width="1"/>
    <rect x="0" y="0" width="260" height="22" rx="6" fill="#18181b"/>
    <text x="10" y="15" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" fill="#f4f4f5">FILE 06 // OFFLINE SOS</text>

