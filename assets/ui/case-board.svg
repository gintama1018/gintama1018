    <!-- Content -->
    <text x="12" y="42" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#f4f4f5">ROADSoS</text>
    <text x="12" y="58" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#a1a1aa">Zero-connectivity emergency platform</text>
    <text x="12" y="72" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#71717a">Offline Caches · International SOS</text>

