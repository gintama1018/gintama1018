    <!-- Content -->
    <text x="12" y="42" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#f4f4f5">AI Teacher (Bharat)</text>
    <text x="12" y="58" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#a1a1aa">Autonomous 720p lesson synthesis</text>
