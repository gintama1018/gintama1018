    <rect x="0" y="0" width="260" height="22" rx="6" fill="#18181b"/>
    <text x="10" y="15" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" fill="#c5a059">FILE 02 // CIVIC AI</text>

