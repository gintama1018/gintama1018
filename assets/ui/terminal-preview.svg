<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="100%" height="100%">
  <defs>
    <!-- Matte Obsidian Terminal Gradient -->
    <linearGradient id="termChassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#121215"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Silk Light Line -->
    <linearGradient id="termGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
  </defs>

  <!-- Outer Aluminum Chassis -->
  <rect x="0" y="0" width="820" height="220" rx="10" fill="url(#termChassis)" stroke="#27272a" stroke-width="1.2"/>

  <!-- Top Window Header Bar -->
  <g transform="translate(16, 12)">
    <circle cx="6" cy="6" r="3.5" fill="#3f3f46"/>
    <circle cx="18" cy="6" r="3.5" fill="#52525b"/>
    <circle cx="30" cy="6" r="3.5" fill="#71717a"/>
    <text x="45" y="9.5" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#a1a1aa" letter-spacing="1">
      silver-soul@workstation :: ~/investigation/audit_sim (zsh)
    </text>
    <line x1="0" y1="18" x2="788" y2="18" stroke="#27272a" stroke-width="0.8"/>
  </g>

  <!-- Inner Screen Console -->
  <rect x="16" y="34" width="788" height="170" rx="6" fill="url(#termGlass)" stroke="#1f1f23" stroke-width="0.8"/>

  <!-- Terminal Content -->
  <g transform="translate(34, 52)">
    <!-- Command Prompt -->
    <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#c5a059">
      ➜ ~/yorozuya <tspan fill="#f4f4f5">./launch_simulation.sh --target=ALL_CASES</tspan>
    </text>

    <!-- Simulated Log Output -->
    <text x="0" y="34" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#a1a1aa">
      [01/06] Verifying BLE Mesh protocol envelopes.............. <tspan fill="#f4f4f5">[X25519 OK]</tspan>
    </text>
    <text x="0" y="50" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#a1a1aa">
      [02/06] Inspecting 106 Delhi MCD sanitation nodes......... <tspan fill="#f4f4f5">[PATHWAY STREAMING]</tspan>
    </text>
    <text x="0" y="66" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#a1a1aa">
      [03/06] ROCA RSA Coppersmith factorization key test....... <tspan fill="#c5a059">[SEED EXTRACTED]</tspan>
    </text>

    <!-- Call to Action Button in Terminal -->
    <g transform="translate(130, 84)">
      <rect x="0" y="0" width="460" height="36" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1">
        <animate attributeName="stroke-color" values="#3f3f46;#71717a;#3f3f46" dur="2.5s" repeatCount="indefinite"/>
      </rect>

      <text x="24" y="23" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#f4f4f5" letter-spacing="0.5">
        ▶ LAUNCH IN-BROWSER INVESTIGATION SIMULATOR
      </text>

      <!-- Blinking Cursor -->
      <rect x="430" y="11" width="8" height="15" fill="#d4d4d8">
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Subtext -->
    <text x="360" y="140" font-family="'JetBrains Mono', monospace" font-size="8" fill="#71717a" text-anchor="middle">
      Zero external dependencies · Runs natively in modern browsers via GitHub Pages
    </text>
  </g>
</svg>
