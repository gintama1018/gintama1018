<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 180" width="100%" height="100%">
  <defs>
    <!-- Matte Charcoal Chassis -->
    <linearGradient id="tapeBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="60%" stop-color="#121215"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Warm Amber & Champagne VU -->
    <linearGradient id="amberVu" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="60%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <linearGradient id="tapeSilk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        from="-1.2 0" to="1.8 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- Outer Cassette Frame -->
  <rect x="0" y="0" width="820" height="180" rx="10" fill="url(#tapeBody)" stroke="#27272a" stroke-width="1.2"/>
  <rect x="0" y="0" width="820" height="180" rx="10" fill="url(#tapeSilk)"/>

  <!-- Four Corner Screws in Polished Titanium -->
  <circle cx="14" cy="14" r="2.5" fill="#52525b"/>
  <circle cx="806" cy="14" r="2.5" fill="#52525b"/>
  <circle cx="14" cy="166" r="2.5" fill="#52525b"/>
  <circle cx="806" cy="166" r="2.5" fill="#52525b"/>

  <!-- Top Cassette Label Area -->
  <g transform="translate(25, 16)">
    <!-- Label Paper -->
    <rect x="0" y="0" width="770" height="72" rx="4" fill="#121215" stroke="#27272a" stroke-width="0.8"/>
    
    <!-- Top Red Stripe replaced by refined Champagne/Bronze Rule -->
    <line x1="0" y1="2" x2="770" y2="2" stroke="#c5a059" stroke-width="2"/>

    <!-- Track Title -->
    <text x="16" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#f4f4f5" letter-spacing="1">
      SIDE A: YOROZUYA NOIR // 2:00 AM DEBUG SESSIONS
    </text>
    <text x="16" y="42" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#a1a1aa">
      "Bleeds red &amp; gold for RCB · 40+ diecast scale models · Hardware is patient, logs never lie"
    </text>

    <!-- Side indicator -->
    <rect x="710" y="10" width="45" height="24" rx="3" fill="#18181b" stroke="#3f3f46" stroke-width="0.8"/>
    <text x="732" y="26" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="900" fill="#f4f4f5" text-anchor="middle">
      A
    </text>
  </g>

  <!-- Center Transparent Tape Window & Spools -->
  <g transform="translate(260, 95)">
    <!-- Tape Window Chamber -->
    <rect x="0" y="0" width="300" height="65" rx="4" fill="#09090b" stroke="#27272a" stroke-width="1"/>

    <!-- Left Spool Hub (Rotating) -->
    <g transform="translate(60, 32)">
      <circle cx="0" cy="0" r="20" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
      <circle cx="0" cy="0" r="14" fill="#09090b"/>
      <!-- Rotating Hub Teeth -->
      <g stroke="#71717a" stroke-width="1.5">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="5s" repeatCount="indefinite"/>
        <line x1="-10" y1="0" x2="10" y2="0"/>
        <line x1="0" y1="-10" x2="0" y2="10"/>
        <line x1="-7" y1="-7" x2="7" y2="7"/>
        <line x1="-7" y1="7" x2="7" y2="-7"/>
      </g>
    </g>

    <!-- Right Spool Hub (Rotating) -->
    <g transform="translate(240, 32)">
      <circle cx="0" cy="0" r="20" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
      <circle cx="0" cy="0" r="14" fill="#09090b"/>
      <g stroke="#71717a" stroke-width="1.5">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="5s" repeatCount="indefinite"/>
        <line x1="-10" y1="0" x2="10" y2="0"/>
        <line x1="0" y1="-10" x2="0" y2="10"/>
        <line x1="-7" y1="-7" x2="7" y2="7"/>
        <line x1="-7" y1="7" x2="7" y2="-7"/>
      </g>
    </g>

    <!-- Tape Bridge in Center with Tape Counter -->
    <rect x="110" y="18" width="80" height="28" rx="2" fill="#121215" stroke="#27272a" stroke-width="0.8"/>
    <text x="150" y="36" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#f4f4f5" text-anchor="middle" letter-spacing="2">
      01:018
    </text>
  </g>

  <!-- Left Audio Equalizer (Bouncing Amber Bars) -->
  <g transform="translate(45, 108)">
    <rect x="0" y="16" width="4" height="28" fill="url(#amberVu)" rx="1">
      <animate attributeName="height" values="10;36;10" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="34;8;34" dur="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="8" y="10" width="4" height="34" fill="url(#amberVu)" rx="1">
      <animate attributeName="height" values="24;42;16;24" dur="0.55s" repeatCount="indefinite"/>
      <animate attributeName="y" values="20;2;28;20" dur="0.55s" repeatCount="indefinite"/>
    </rect>
    <rect x="16" y="6" width="4" height="38" fill="url(#amberVu)" rx="1">
      <animate attributeName="height" values="38;18;44;38" dur="0.7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="6;26;0;6" dur="0.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="24" y="14" width="4" height="30" fill="url(#amberVu)" rx="1">
      <animate attributeName="height" values="16;36;22;16" dur="0.48s" repeatCount="indefinite"/>
      <animate attributeName="y" values="28;8;22;28" dur="0.48s" repeatCount="indefinite"/>
    </rect>
    <rect x="32" y="22" width="4" height="22" fill="url(#amberVu)" rx="1">
      <animate attributeName="height" values="10;28;10" dur="0.65s" repeatCount="indefinite"/>
      <animate attributeName="y" values="34;16;34" dur="0.65s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="52" font-family="'JetBrains Mono', monospace" font-size="7" fill="#71717a">VU CH-L</text>
  </g>

  <!-- Right Audio Equalizer (Bouncing Amber Bars) -->
  <g transform="translate(735, 108)">
    <rect x="0" y="18" width="4" height="26" fill="url(#amberVu)" rx="1">
      <animate attributeName="height" values="14;34;14" dur="0.52s" repeatCount="indefinite"/>
      <animate attributeName="y" values="30;10;30" dur="0.52s" repeatCount="indefinite"/>
    </rect>
    <rect x="8" y="8" width="4" height="36" fill="url(#amberVu)" rx="1">
      <animate attributeName="height" values="36;16;40;36" dur="0.68s" repeatCount="indefinite"/>
      <animate attributeName="y" values="8;28;4;8" dur="0.68s" repeatCount="indefinite"/>
    </rect>
    <rect x="16" y="12" width="4" height="32" fill="url(#amberVu)" rx="1">
      <animate attributeName="height" values="20;42;18;20" dur="0.45s" repeatCount="indefinite"/>
      <animate attributeName="y" values="24;2;26;24" dur="0.45s" repeatCount="indefinite"/>
    </rect>
    <rect x="24" y="20" width="4" height="24" fill="url(#amberVu)" rx="1">
      <animate attributeName="height" values="12;30;12" dur="0.62s" repeatCount="indefinite"/>
      <animate attributeName="y" values="32;14;32" dur="0.62s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="52" font-family="'JetBrains Mono', monospace" font-size="7" fill="#71717a">VU CH-R</text>
  </g>
</svg>
