<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#111722"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="50%" stop-color="#39d353"/>
      <stop offset="75%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#238636">
        <animate attributeName="stop-color" 
          values="#238636;#39d353;#D4AF37;#238636" 
          dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Holographic Rainbow Gradient -->
    <linearGradient id="holoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30" stop-opacity="0.3"/>
      <stop offset="25%" stop-color="#ff9500" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#34c759" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#00c7be" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#af52de" stop-opacity="0.3"/>
      <animateTransform attributeName="gradientTransform" type="rotate"
        from="0 0.5 0.5" to="360 0.5 0.5" dur="10s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Scanner Laser Beam -->
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#39d353" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39d353" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39d353" stop-opacity="0"/>
    </linearGradient>

    <!-- Shimmer Sheen -->
    <linearGradient id="cardSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        from="-1 0" to="2 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Carbon Pattern -->
    <pattern id="dotPattern" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1f293d" opacity="0.6"/>
      <circle cx="9" cy="9" r="1" fill="#161f2e" opacity="0.6"/>
    </pattern>

    <clipPath id="avatarClip">
      <circle cx="85" cy="115" r="54"/>
    </clipPath>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="4" y="4" width="812" height="242" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>
  <rect x="4" y="4" width="812" height="242" rx="14" fill="url(#dotPattern)"/>
  <rect x="4" y="4" width="812" height="242" rx="14" fill="url(#cardSheen)"/>

  <!-- Top Agency Tech Ribbon -->
  <path d="M 4 24 L 280 24 L 295 4 L 4 4 Z" fill="#161f2e" stroke="#238636" stroke-width="1"/>
  <text x="18" y="17" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#39d353" letter-spacing="1.5">
    YOROZUYA INVESTIGATIVE UNIT // SEC-ID #01018
  </text>

  <!-- Top Right Live Status Pill -->
  <g transform="translate(640, 10)">
    <rect x="0" y="0" width="160" height="22" rx="4" fill="#0d1117" stroke="#39d353" stroke-width="1"/>
    <circle cx="14" cy="11" r="4" fill="#39d353">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="15" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#39d353" letter-spacing="1">
      OPERATIONAL: ACTIVE
    </text>
  </g>

  <!-- Left Side: Profile Picture & Reticle -->
  <g transform="translate(10, 0)">
    <!-- Rotating Cyber Reticles around photo -->
    <circle cx="85" cy="115" r="62" fill="none" stroke="#238636" stroke-width="1.5" stroke-dasharray="16 8">
      <animateTransform attributeName="transform" type="rotate" from="0 85 115" to="360 85 115" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="85" cy="115" r="68" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="8 20" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="360 85 115" to="0 85 115" dur="18s" repeatCount="indefinite"/>
    </circle>

    <!-- Avatar Image -->
    <image href="https://avatars.githubusercontent.com/u/196290988?s=280&amp;v=4" x="31" y="61" width="108" height="108" clip-path="url(#avatarClip)"/>
    <circle cx="85" cy="115" r="54" fill="none" stroke="#39d353" stroke-width="2"/>

    <!-- Target Crosshairs -->
    <path d="M 85 45 L 85 55 M 85 175 L 85 185 M 15 115 L 25 115 M 145 115 L 155 115" stroke="#39d353" stroke-width="1.5"/>

    <!-- Under-Photo Tag -->
    <rect x="35" y="190" width="100" height="18" rx="3" fill="#161f2e" stroke="#238636" stroke-width="0.8"/>
    <text x="85" y="202" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" fill="#C0C0C0" text-anchor="middle">
      CLASS OF 2027
    </text>
  </g>

  <!-- Vertical Hologram Strip -->
  <g transform="translate(178, 28)">
    <rect x="0" y="0" width="8" height="200" fill="url(#holoGrad)" rx="3"/>
    <rect x="0" y="0" width="8" height="200" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.4"/>
  </g>

  <!-- Center Dossier Data -->
  <g transform="translate(202, 38)">
    <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#6e7681" letter-spacing="2">
      OPERATIVE IDENTIFIER
    </text>
    <text x="0" y="42" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="0.5">
      SONU JANGIR
    </text>
    <text x="175" y="40" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#D4AF37">
      [GINTAMA]
    </text>

    <text x="0" y="62" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#39d353">
      Lead Systems Architect &amp; Security Auditor
    </text>

    <!-- Details Grid -->
    <g transform="translate(0, 78)">
      <!-- Row 1 -->
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8b949e">AFFILIATION:</text>
      <text x="90" y="14" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#e6edf3">Silver Soul Studios // UEM Jaipur</text>

      <!-- Row 2 -->
      <text x="0" y="32" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8b949e">CLEARANCE:</text>
      <text x="90" y="32" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#39d353">LEVEL 4 CLASSIFIED (OMNI)</text>

      <!-- Row 3 -->
      <text x="0" y="50" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8b949e">COORDINATES:</text>
      <text x="90" y="50" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#D4AF37">27.1264° N, 75.5414° E (Kaladera)</text>

      <!-- Row 4 -->
      <text x="0" y="68" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8b949e">SPECIALIZATION:</text>
      <text x="90" y="68" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#58a6ff">Protocols · BLE Topologies · Applied Crypto</text>

      <!-- Row 5 -->
      <text x="0" y="86" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8b949e">YOROZUYA RULE:</text>
      <text x="90" y="86" font-family="'JetBrains Mono', monospace" font-size="9" font-style="italic" fill="#C0C0C0">"If the problem is fake, no framework can save it."</text>
    </g>
  </g>

  <!-- Right Section: Biometric Fingerprint & Security Seal -->
  <g transform="translate(635, 42)">
    <!-- Fingerprint Scanner Frame -->
    <rect x="0" y="0" width="165" height="120" rx="8" fill="#0d1117" stroke="#238636" stroke-width="1.2"/>
    <text x="82" y="18" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" fill="#39d353" text-anchor="middle" letter-spacing="1">
      BIOMETRIC VERIFIED
    </text>

    <!-- Fingerprint graphic paths -->
    <g transform="translate(42, 26)" stroke="#39d353" stroke-width="1.4" fill="none" opacity="0.8">
      <path d="M 40 10 A 25 25 0 0 1 65 35 A 35 35 0 0 1 60 65"/>
      <path d="M 32 15 A 18 18 0 0 1 55 35 A 28 28 0 0 1 50 60"/>
      <path d="M 25 22 A 12 12 0 0 1 45 35 A 20 20 0 0 1 40 55"/>
      <path d="M 20 32 A 8 8 0 0 1 35 35 A 12 12 0 0 1 32 48"/>
      <path d="M 40 35 A 2 2 0 1 1 40 34"/>
      <path d="M 15 42 A 30 30 0 0 1 22 25"/>
      <path d="M 12 55 A 40 40 0 0 1 18 35"/>
    </g>

    <!-- Animated Laser Scan Line -->
    <g>
      <rect x="5" y="24" width="155" height="4" fill="url(#laserBeam)">
        <animate attributeName="y" values="24;110;24" dur="2.8s" repeatCount="indefinite"/>
      </rect>
      <line x1="5" y1="26" x2="160" y2="26" stroke="#39d353" stroke-width="1.5">
        <animate attributeName="y1" values="26;112;26" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="26;112;26" dur="2.8s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- ECG / Audio Waveform Under Scanner -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="165" height="48" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <text x="8" y="14" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" fill="#8b949e">
        TELEMETRY PULSE // 72 BPM
      </text>

      <!-- Live pulsing ECG line -->
      <path d="M 8 32 L 35 32 L 42 18 L 48 42 L 54 26 L 60 35 L 65 32 L 95 32 L 102 18 L 108 42 L 114 26 L 120 35 L 125 32 L 155 32"
            fill="none" stroke="#39d353" stroke-width="1.5" stroke-dasharray="160" stroke-dashoffset="160">
        <animate attributeName="stroke-dashoffset" values="160;0" dur="1.8s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Bottom Barcode -->
    <g transform="translate(0, 186)" stroke="#C0C0C0" stroke-width="1.5">
      <line x1="4" y1="0" x2="4" y2="12"/>
      <line x1="8" y1="0" x2="8" y2="12" stroke-width="2.5"/>
      <line x1="14" y1="0" x2="14" y2="12"/>
      <line x1="18" y1="0" x2="18" y2="12" stroke-width="3"/>
      <line x1="26" y1="0" x2="26" y2="12"/>
      <line x1="30" y1="0" x2="30" y2="12" stroke-width="2"/>
      <line x1="36" y1="0" x2="36" y2="12"/>
      <line x1="42" y1="0" x2="42" y2="12" stroke-width="4"/>
      <line x1="52" y1="0" x2="52" y2="12"/>
      <line x1="58" y1="0" x2="58" y2="12" stroke-width="2"/>
      <line x1="64" y1="0" x2="64" y2="12"/>
      <line x1="72" y1="0" x2="72" y2="12" stroke-width="3"/>
      <line x1="80" y1="0" x2="80" y2="12"/>
      <line x1="86" y1="0" x2="86" y2="12" stroke-width="1.5"/>
      <line x1="94" y1="0" x2="94" y2="12" stroke-width="3"/>
      <line x1="104" y1="0" x2="104" y2="12"/>
      <line x1="110" y1="0" x2="110" y2="12" stroke-width="2.5"/>
      <line x1="118" y1="0" x2="118" y2="12"/>
      <line x1="126" y1="0" x2="126" y2="12" stroke-width="3.5"/>
      <line x1="136" y1="0" x2="136" y2="12"/>
      <line x1="142" y1="0" x2="142" y2="12" stroke-width="2"/>
      <line x1="150" y1="0" x2="150" y2="12"/>
      <line x1="158" y1="0" x2="158" y2="12" stroke-width="2"/>
    </g>
  </g>
</svg>
