<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian & Smoked Glass Gradients -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="40%" stop-color="#121215"/>
      <stop offset="100%" stop-color="#0c0c0e"/>
    </linearGradient>

    <!-- Refined Titanium Border Gradient -->
    <linearGradient id="titaniumBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="30%" stop-color="#71717a"/>
      <stop offset="50%" stop-color="#d4d4d8"/>
      <stop offset="70%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>

    <!-- Silk Sheen Highlight -->
    <linearGradient id="silkSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        from="-1.2 0" to="1.8 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Subdued Champagne Laser -->
    <linearGradient id="silverLaser" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e4e4e7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f4f4f5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e4e4e7" stop-opacity="0"/>
    </linearGradient>

    <!-- Micro Mesh Grid Pattern -->
    <pattern id="microMesh" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#27272a" opacity="0.4"/>
    </pattern>

    <clipPath id="avatarCircle">
      <circle cx="85" cy="115" r="52"/>
    </clipPath>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="2" y="2" width="816" height="236" rx="12" fill="url(#badgeBg)" stroke="url(#titaniumBorder)" stroke-width="1"/>
  <rect x="2" y="2" width="816" height="236" rx="12" fill="url(#microMesh)"/>
  <rect x="2" y="2" width="816" height="236" rx="12" fill="url(#silkSheen)"/>

  <!-- Top Agency Ribbon -->
  <g transform="translate(20, 16)">
    <text x="0" y="10" font-family="'JetBrains Mono', -apple-system, monospace" font-size="9" font-weight="600" fill="#71717a" letter-spacing="3">
      SILVER SOUL ARCHIVES // IDENTIFICATION PASSPORT #01018
    </text>
    <line x1="0" y1="18" x2="780" y2="18" stroke="#27272a" stroke-width="0.8"/>
  </g>

  <!-- Top Right Clearance Pill -->
  <g transform="translate(640, 12)">
    <rect x="0" y="0" width="155" height="20" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="0.8"/>
    <circle cx="12" cy="10" r="3" fill="#d4d4d8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="24" y="13.5" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" fill="#e4e4e7" letter-spacing="1.2">
      CLEARANCE: LEVEL 4
    </text>
  </g>

  <!-- Left: Avatar Photo Frame -->
  <g transform="translate(10, 0)">
    <!-- Thin Titanium Orbital Ring -->
    <circle cx="85" cy="115" r="59" fill="none" stroke="#3f3f46" stroke-width="0.8" stroke-dasharray="8 6">
      <animateTransform attributeName="transform" type="rotate" from="0 85 115" to="360 85 115" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle cx="85" cy="115" r="63" fill="none" stroke="#27272a" stroke-width="0.5"/>

    <!-- Avatar Image -->
    <image href="https://avatars.githubusercontent.com/u/196290988?s=280&amp;v=4" x="33" y="63" width="104" height="104" clip-path="url(#avatarCircle)"/>
    <circle cx="85" cy="115" r="52" fill="none" stroke="#a1a1aa" stroke-width="1.2"/>

    <!-- Under-Photo Tag -->
    <rect x="35" y="182" width="100" height="16" rx="3" fill="#18181b" stroke="#27272a" stroke-width="0.8"/>
    <text x="85" y="193" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.8">
      UEM JAIPUR · '27
    </text>
  </g>

  <!-- Center: Dossier Details -->
  <g transform="translate(180, 48)">
    <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#71717a" letter-spacing="2.5">
      OPERATIVE DOSSIER
    </text>
    <text x="0" y="38" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" fill="#f4f4f5" letter-spacing="0.5">
      SONU JANGIR
    </text>
    <text x="160" y="36" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#c5a059">
      [GINTAMA]
    </text>

    <text x="0" y="56" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="500" fill="#d4d4d8">
      Lead Systems Architect &amp; Security Researcher
    </text>

    <!-- Details Specs Grid -->
    <g transform="translate(0, 72)">
      <!-- Item 1 -->
      <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#71717a">STUDIO:</text>
      <text x="85" y="12" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#e4e4e7">Silver Soul Studios // Yorozuya Unit</text>

      <!-- Item 2 -->
      <text x="0" y="28" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#71717a">COORDINATES:</text>
      <text x="85" y="28" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="500" fill="#c5a059">27.1264° N, 75.5414° E (Kaladera)</text>

      <!-- Item 3 -->
      <text x="0" y="44" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#71717a">DISCIPLINE:</text>
      <text x="85" y="44" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="500" fill="#d4d4d8">Protocols · Cryptanalysis · Multimodal AI</text>

      <!-- Item 4 -->
      <text x="0" y="60" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#71717a">PRINCIPLE:</text>
      <text x="85" y="60" font-family="'JetBrains Mono', monospace" font-size="8.5" font-style="italic" fill="#a1a1aa">"If the problem is fake, no framework can save it."</text>
    </g>
  </g>

  <!-- Right: Minimalist Biometric Card & Telemetry -->
  <g transform="translate(635, 48)">
    <!-- Smoked Acrylic Frame -->
    <rect x="0" y="0" width="160" height="105" rx="6" fill="#121215" stroke="#27272a" stroke-width="0.8"/>
    <text x="80" y="16" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="1">
      BIOMETRIC VERIFIED
    </text>

    <!-- Fingerprint graphic in refined soft silver -->
    <g transform="translate(42, 22)" stroke="#71717a" stroke-width="1.2" fill="none" opacity="0.65">
      <path d="M 38 8 A 24 24 0 0 1 62 32 A 32 32 0 0 1 58 58"/>
      <path d="M 30 14 A 18 18 0 0 1 52 32 A 26 26 0 0 1 48 54"/>
      <path d="M 24 20 A 12 12 0 0 1 42 32 A 18 18 0 0 1 38 50"/>
      <path d="M 18 28 A 8 8 0 0 1 32 32 A 12 12 0 0 1 30 44"/>
      <path d="M 38 32 A 1.5 1.5 0 1 1 38 31"/>
      <path d="M 14 38 A 28 28 0 0 1 20 22"/>
    </g>

    <!-- Subdued Silver Laser Sweep -->
    <g>
      <rect x="6" y="20" width="148" height="3" fill="url(#silverLaser)">
        <animate attributeName="y" values="20;95;20" dur="3.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Heartbeat / Telemetry Pulse -->
    <g transform="translate(0, 114)">
      <rect x="0" y="0" width="160" height="32" rx="4" fill="#121215" stroke="#27272a" stroke-width="0.8"/>
      <path d="M 10 16 L 40 16 L 46 8 L 52 24 L 56 12 L 60 18 L 65 16 L 95 16 L 101 8 L 107 24 L 111 12 L 115 18 L 120 16 L 150 16"
            fill="none" stroke="#a1a1aa" stroke-width="1" stroke-dasharray="140" stroke-dashoffset="140">
        <animate attributeName="stroke-dashoffset" values="140;0" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Aesthetic Barcode -->
    <g transform="translate(4, 155)" stroke="#71717a" stroke-width="1.2" opacity="0.8">
      <line x1="0" y1="0" x2="0" y2="10"/>
      <line x1="4" y1="0" x2="4" y2="10" stroke-width="2"/>
      <line x1="9" y1="0" x2="9" y2="10"/>
      <line x1="14" y1="0" x2="14" y2="10" stroke-width="2.5"/>
      <line x1="20" y1="0" x2="20" y2="10"/>
      <line x1="26" y1="0" x2="26" y2="10" stroke-width="1.5"/>
      <line x1="33" y1="0" x2="33" y2="10"/>
      <line x1="40" y1="0" x2="40" y2="10" stroke-width="3"/>
      <line x1="48" y1="0" x2="48" y2="10"/>
      <line x1="55" y1="0" x2="55" y2="10" stroke-width="1.5"/>
      <line x1="62" y1="0" x2="62" y2="10"/>
      <line x1="70" y1="0" x2="70" y2="10" stroke-width="2"/>
      <line x1="78" y1="0" x2="78" y2="10"/>
      <line x1="86" y1="0" x2="86" y2="10" stroke-width="2.5"/>
      <line x1="94" y1="0" x2="94" y2="10"/>
      <line x1="102" y1="0" x2="102" y2="10" stroke-width="1.5"/>
      <line x1="110" y1="0" x2="110" y2="10"/>
      <line x1="118" y1="0" x2="118" y2="10" stroke-width="2.5"/>
      <line x1="126" y1="0" x2="126" y2="10"/>
      <line x1="134" y1="0" x2="134" y2="10" stroke-width="2"/>
      <line x1="142" y1="0" x2="142" y2="10"/>
      <line x1="150" y1="0" x2="150" y2="10" stroke-width="1.5"/>
    </g>
  </g>
</svg>
